  function clickStudio(id, mx, my) {
    var cell, n;
    if (id === "back" || id === "studio-done") { closeStudio(); return true; }
    if (id === "studio-type-cube") { setStudioType("skin", MODE_CUBE); return true; }
    if (id === "studio-type-ship") { setStudioType("skin", MODE_SHIP); return true; }
    if (id === "studio-type-spider") { setStudioType("skin", MODE_SPIDER); return true; }
    if (id === "studio-type-arrow") { setStudioType("skin", MODE_ARROW); return true; }
    if (id === "studio-type-face") { setStudioType("face", null); return true; }
    if (id === "studio-tool-brush") { studioTool = "brush"; return true; }
    if (id === "studio-tool-eraser") { studioTool = "eraser"; return true; }
    if (id === "studio-tool-fill") { studioTool = "fill"; return true; }
    if (id === "studio-brush-1") { studioBrush = 1; return true; }
    if (id === "studio-brush-2") { studioBrush = 2; return true; }
    if (id === "studio-brush-3") { studioBrush = 3; return true; }
    if (id === "studio-undo") { undoStudio(); return true; }
    if (id === "studio-clear") { clearStudioPixels(); return true; }
    if (id.indexOf("studio-color-") === 0) {
      n = parseInt(id.slice(13), 10);
      if (STUDIO_PALETTE[n]) {
        studioColor = STUDIO_PALETTE[n];
        studioTool = "brush";
        if (studioColorEl) studioColorEl.value = studioColor;
      }
      return true;
    }
    if (id === "studio-grid") {
      cell = cellFromPointer(mx, my);
      if (cell) paintAt(cell.c, cell.r, studioColor, true);
      return true;
    }
    return false;
  }

  function studioPointerDown(c, e) {
    var hit = hitUi(c.x, c.y), cell;
    if (hit && hit.id === "studio-grid") {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      studioPainting = true;
      cell = cellFromPointer(c.x, c.y);
      if (cell) paintAt(cell.c, cell.r, studioColor, true);
      return true;
    }
    if (hit) {
      clickStudio(hit.id, c.x, c.y);
      return true;
    }
    return false;
  }

  function studioPointerMove(c) {
    var cell;
    if (!studioPainting || studioTool === "fill") return;
    cell = cellFromPointer(c.x, c.y);
    if (cell) paintAt(cell.c, cell.r, studioColor, false);
  }

  function studioPointerUp() {
    studioPainting = false;
  }

  function customSkinsForMode(mode) {
    var out = [], i, s;
    for (i = 0; i < customSlots.length; i++) {
      s = customSlots[i];
      if (s.kind === "skin" && s.mode === mode) out.push(s);
    }
    return out;
  }


  function roundRect(c, x, y, w, h, r) {
    if (r > w / 2) r = w / 2;
    if (r > h / 2) r = h / 2;
    c.beginPath();
    c.moveTo(x + r, y);
    c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r);
    c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r);
    c.closePath();
  }

  function levelTheme() {
    var theme = currentLevel() ? currentLevel().theme : "lime";
    if (state === STATE_TITLE && menuPage === MENU_MAIN) theme = "lime";
    if (theme === "ember") {
      return { top: "#1c0a0c", mid: "#14080c", bot: "#18060a", grid: "rgba(255,154,61,0.07)", boxA: "rgba(255,154,61,0.10)", boxB: "rgba(255,61,138,0.08)", h0: "rgba(255,154,61,0)", h1: "rgba(255,154,61,0.08)", h2: "rgba(255,61,138,0.10)" };
    }
    if (theme === "cinder") {
      return { top: "#120814", mid: "#0c0612", bot: "#10060e", grid: "rgba(181,140,255,0.07)", boxA: "rgba(181,140,255,0.10)", boxB: "rgba(255,154,61,0.08)", h0: "rgba(181,140,255,0)", h1: "rgba(181,140,255,0.07)", h2: "rgba(255,154,61,0.10)" };
    }
    if (theme === "azure") {
      return { top: "#061428", mid: "#06101e", bot: "#071018", grid: "rgba(61,240,255,0.08)", boxA: "rgba(61,240,255,0.10)", boxB: "rgba(125,255,74,0.06)", h0: "rgba(61,240,255,0)", h1: "rgba(61,240,255,0.08)", h2: "rgba(61,160,255,0.10)" };
    }
    if (theme === "magenta") {
      return { top: "#16061a", mid: "#120414", bot: "#180814", grid: "rgba(255,61,138,0.08)", boxA: "rgba(255,61,138,0.10)", boxB: "rgba(181,140,255,0.08)", h0: "rgba(255,61,138,0)", h1: "rgba(255,61,138,0.08)", h2: "rgba(181,140,255,0.10)" };
    }
    if (theme === "prism") {
      return { top: "#0c0a22", mid: "#0a081c", bot: "#12081a", grid: "rgba(125,255,74,0.06)", boxA: "rgba(61,240,255,0.08)", boxB: "rgba(255,61,138,0.08)", h0: "rgba(125,255,74,0)", h1: "rgba(61,240,255,0.07)", h2: "rgba(255,61,138,0.10)" };
    }
    return { top: "#0b0b22", mid: "#0a0720", bot: "#12061a", grid: "rgba(61,240,255,0.06)", boxA: "rgba(255,61,138,0.08)", boxB: "rgba(61,240,255,0.08)", h0: "rgba(61,240,255,0)", h1: "rgba(61,240,255,0.05)", h2: "rgba(255,61,138,0.08)" };
  }

  function drawBackground() {
    var th = levelTheme();
    var g = ctx.createLinearGradient(0, 0, 0, VH);
    g.addColorStop(0, th.top);
    g.addColorStop(0.55, th.mid);
    g.addColorStop(1, th.bot);
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, VW, VH);

    var i, x, y;
    var par = camX * 0.22;
    ctx.save();
    ctx.strokeStyle = th.grid;
    ctx.lineWidth = 1;
    var grid = 40;
    ctx.beginPath();
    for (x = -((par) % grid); x <= VW; x += grid) {
      ctx.moveTo(x, 0);
      ctx.lineTo(x, VH);
    }
    for (y = 0; y <= VH; y += grid) {
      ctx.moveTo(0, y);
      ctx.lineTo(VW, y);
    }
    ctx.stroke();

    var par2 = camX * 0.08;
    for (i = 0; i < 8; i++) {
      var hx = ((i * 280) - par2) % (VW + 200) - 80;
      var hy = 70 + (i % 3) * 90;
      ctx.strokeStyle = i % 2 ? th.boxA : th.boxB;
      ctx.lineWidth = 2;
      ctx.strokeRect(hx, hy, 70, 70);
      ctx.strokeRect(hx + 16, hy + 16, 38, 38);
    }
    ctx.restore();

    var hg = ctx.createLinearGradient(0, GROUND - 80, 0, VH);
    hg.addColorStop(0, th.h0);
    hg.addColorStop(0.4, th.h1);
    hg.addColorStop(1, th.h2);
    ctx.fillStyle = hg;
    ctx.fillRect(0, GROUND - 80, VW, VH - (GROUND - 80));
    drawLandscape();
  }

  function landscapeY(worldX, base, amp, f1, f2, ph) {
    return base + Math.sin(worldX * f1 + ph) * amp + Math.sin(worldX * f2 + ph * 1.7) * amp * 0.45;
  }

  function fillHills(par, base, amp, f1, f2, ph, color, step) {
    var x, wx, y, st = step || 24;
    ctx.fillStyle = color;
    ctx.beginPath();
    ctx.moveTo(-20, VH);
    for (x = -20; x <= VW + 40; x += st) {
      wx = x + par;
      y = landscapeY(wx, base, amp, f1, f2, ph);
      ctx.lineTo(x, y);
    }
    ctx.lineTo(VW + 40, VH);
    ctx.closePath();
    ctx.fill();
  }

  function drawSkyline(par, base, color) {
    var i, x, w, h;
    ctx.fillStyle = color;
    for (i = -1; i < 22; i++) {
      x = i * 70 - (par % 70) - 70;
      w = 28 + ((i * 17) % 24);
      h = 40 + ((i * 13) % 70);
      ctx.fillRect(x, base - h, w, h);
      if (i % 3 === 0) ctx.fillRect(x + 8, base - h - 16, 6, 16);
    }
  }

  function drawLandscape() {
    var mode = (state === STATE_TITLE) ? MODE_CUBE : player.mode;
    var far, mid, near, line, base;
    if (mode === MODE_SHIP) {
      far = "rgba(18, 28, 70, 0.55)"; mid = "rgba(16, 36, 80, 0.62)";
      near = "rgba(10, 22, 52, 0.72)"; line = "rgba(61,240,255,0.07)"; base = 300;
    } else if (mode === MODE_SPIDER) {
      far = "rgba(8, 22, 28, 0.6)"; mid = "rgba(6, 28, 32, 0.7)";
      near = "rgba(4, 16, 22, 0.8)"; line = "rgba(61,240,255,0.05)"; base = 250;
    } else if (mode === MODE_ARROW) {
      far = "rgba(40, 10, 48, 0.5)"; mid = "rgba(36, 12, 60, 0.62)";
      near = "rgba(22, 8, 40, 0.78)"; line = "rgba(255,61,138,0.08)"; base = 290;
    } else {
      far = "rgba(28, 14, 48, 0.5)"; mid = "rgba(32, 16, 56, 0.6)";
      near = "rgba(18, 10, 36, 0.75)"; line = "rgba(255,61,138,0.06)"; base = 310;
    }
    fillHills(camX * 0.12, base + 20, 28, 0.004, 0.009, 0.2, far, 28);
    fillHills(camX * 0.22, base + 50, 36, 0.006, 0.013, 1.4, mid, 22);
    if (mode === MODE_SHIP || mode === MODE_SPIDER) drawSkyline(camX * 0.28, base + 70, near);
    else fillHills(camX * 0.38, base + 80, 26, 0.01, 0.021, 2.1, near, 18);
    ctx.strokeStyle = line;
    ctx.lineWidth = 2;
    ctx.beginPath();
    var x, y;
    for (x = 0; x <= VW; x += 20) {
      y = landscapeY(x + camX * 0.38, base + 80, 26, 0.01, 0.021, 2.1);
      if (x === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  function drawSolid(s) {
    var x = s.x - camX;
    var y = s.y;
    if (x + s.w < -20 || x > VW + 20) return;
    ctx.fillStyle = "#141432";
    ctx.fillRect(x, y, s.w, s.h);
    ctx.fillStyle = "#1d1d4a";
    ctx.fillRect(x, y + 8, s.w, Math.max(0, s.h - 8));
    // neon top edge
    var face = s.face || "top";
    ctx.fillStyle = "#3df0ff";
    ctx.shadowColor = "#3df0ff";
    ctx.shadowBlur = 12;
    if (face === "bottom") ctx.fillRect(x, y + s.h - 4, s.w, 4);
    else if (face === "both") {
      ctx.fillRect(x, y, s.w, 4);
      ctx.fillRect(x, y + s.h - 4, s.w, 4);
    } else ctx.fillRect(x, y, s.w, 4);
    ctx.shadowBlur = 0;
    // inner hatch
    ctx.save();
    ctx.beginPath();
    ctx.rect(x, y + 4, s.w, Math.min(s.h - 4, 80));
    ctx.clip();
    ctx.strokeStyle = "rgba(61,240,255,0.1)";
    ctx.lineWidth = 1;
    var k;
    for (k = -40; k < s.w + 40; k += 16) {
      ctx.beginPath();
      ctx.moveTo(x + k, y);
      ctx.lineTo(x + k + 40, y + 40);
      ctx.stroke();
    }
    ctx.restore();
    // left highlight
    ctx.fillStyle = "rgba(255,255,255,0.08)";
    ctx.fillRect(x, y, 2, Math.min(s.h, 120));
  }

  function drawSpike(sp) {
    var x = sp.x - camX;
    if (x + sp.w < -20 || x > VW + 20) return;
    ctx.save();
    ctx.shadowColor = "#ff3d8a";
    ctx.shadowBlur = 14;
    ctx.beginPath();
    if (sp.dir === "up") {
      ctx.moveTo(x + sp.w / 2, sp.y);
      ctx.lineTo(x, sp.y + sp.h);
      ctx.lineTo(x + sp.w, sp.y + sp.h);
    } else {
      ctx.moveTo(x + sp.w / 2, sp.y + sp.h);
      ctx.lineTo(x, sp.y);
      ctx.lineTo(x + sp.w, sp.y);
    }
    ctx.closePath();
    var grd = ctx.createLinearGradient(x, sp.y, x, sp.y + sp.h);
    if (sp.dir === "up") {
      grd.addColorStop(0, "#ffe0f0");
      grd.addColorStop(0.35, "#ff3d8a");
      grd.addColorStop(1, "#8a1040");
    } else {
      grd.addColorStop(0, "#8a1040");
      grd.addColorStop(0.65, "#ff3d8a");
      grd.addColorStop(1, "#ffe0f0");
    }
    ctx.fillStyle = grd;
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.strokeStyle = "rgba(255,225,74,0.5)";
    ctx.lineWidth = 1;
    ctx.stroke();
    ctx.restore();
  }

  function drawPad(p) {
    var x = p.x - camX;
    if (x + p.w < -20 || x > VW + 20) return;
    var pulse = 0.5 + 0.5 * Math.sin(titleTime * 10);
    ctx.save();
    ctx.shadowColor = "#ffe14a";
    ctx.shadowBlur = 16;
    ctx.fillStyle = p.used ? "#665810" : "#ffe14a";
    roundRect(ctx, x, p.y, p.w, p.h, 3);
    ctx.fill();
    ctx.shadowBlur = 0;
    if (!p.used) {
      ctx.fillStyle = "rgba(11,11,34," + (0.4 + 0.3 * pulse) + ")";
      ctx.beginPath();
      ctx.moveTo(x + p.w / 2, p.y + 1);
      ctx.lineTo(x + p.w * 0.72, p.y + p.h - 2);
      ctx.lineTo(x + p.w * 0.28, p.y + p.h - 2);
      ctx.closePath();
      ctx.fill();
    }
    ctx.restore();
  }

  function drawDecos() {
    var i, d, x;
    for (i = 0; i < decos.length; i++) {
      d = decos[i];
      if (d.type === "portal") {
        x = d.x - camX;
        if (x < -80 || x > VW + 80) continue;
        var col = d.mode === MODE_SHIP ? "#3df0ff" : d.mode === MODE_SPIDER ? "#ff9a3d" : d.mode === MODE_ARROW ? "#ff3d8a" : "#7dff4a";
        var glowCol = d.mode === MODE_SHIP ? "rgba(61,240,255,0.55)" : d.mode === MODE_SPIDER ? "rgba(255,154,61,0.55)" : d.mode === MODE_ARROW ? "rgba(255,61,138,0.55)" : "rgba(125,255,74,0.55)";
        ctx.save();
        ctx.translate(x, GROUND - 150);
        var glow = ctx.createRadialGradient(0, 0, 8, 0, 0, 88);
        glow.addColorStop(0, glowCol);
        glow.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(0, 0, 88, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = col;
        ctx.shadowColor = col;
        ctx.shadowBlur = reducedMotion ? 0 : 16;
        ctx.lineWidth = 5;
        ctx.strokeRect(-26, -50, 52, 100);
        ctx.strokeRect(-16, -36, 32, 72);
        ctx.shadowBlur = 0;
        ctx.restore();
        ctx.save();
        ctx.fillStyle = col;
        ctx.font = "bold 20px Trebuchet MS, sans-serif";
        ctx.textAlign = "center";
        ctx.shadowColor = col;
        ctx.shadowBlur = reducedMotion ? 0 : 10;
        ctx.fillText(d.name, x, GROUND - 268);
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#e8f0ff";
        ctx.font = "13px Trebuchet MS, sans-serif";
        ctx.fillText(d.hint, x, GROUND - 248);
        ctx.restore();
        continue;
      }
      if (d.type === "gate") {
        x = d.x - camX;
        if (x + d.w < -20 || x > VW + 20) continue;
        ctx.save();
        ctx.fillStyle = "rgba(255,225,74,0.08)";
        ctx.fillRect(x, GROUND - 160, d.w, 160);
        ctx.strokeStyle = "#ffe14a";
        ctx.shadowColor = "#ffe14a";
        ctx.shadowBlur = 10;
        ctx.lineWidth = 3;
        ctx.strokeRect(x + 4, GROUND - 156, d.w - 8, 150);
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#ffe14a";
        ctx.font = "bold 14px Trebuchet MS, sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("KEEP LOW", x + d.w / 2, GROUND - 140);
        var k;
        for (k = 0; k < d.w; k += 16) {
          ctx.fillStyle = (Math.floor(k / 16) % 2) ? "#ffe14a" : "#16120a";
          ctx.fillRect(x + k, GROUND - 8, 16, 8);
        }
        ctx.restore();
      }
      if (d.type === "goal") {
        x = d.x - camX;
        if (x < -80 || x > VW + 80) continue;
        var t = titleTime;
        ctx.save();
        ctx.translate(x + 20, GROUND - 110);
        var glow = ctx.createRadialGradient(0, 0, 10, 0, 0, 90);
        glow.addColorStop(0, "rgba(255,225,74,0.55)");
        glow.addColorStop(1, "rgba(255,225,74,0)");
        ctx.fillStyle = glow;
        ctx.beginPath();
        ctx.arc(0, 0, 90, 0, Math.PI * 2);
        ctx.fill();
        ctx.rotate(t * 0.6);
        ctx.strokeStyle = "#ffe14a";
        ctx.shadowColor = "#ffe14a";
        ctx.shadowBlur = 16;
        ctx.lineWidth = 4;
        ctx.strokeRect(-28, -28, 56, 56);
        ctx.rotate(Math.PI / 4);
        ctx.strokeStyle = "#3df0ff";
        ctx.strokeRect(-22, -22, 44, 44);
        ctx.restore();
        ctx.save();
        ctx.fillStyle = "#1a1430";
        ctx.fillRect(x - 10, GROUND - 180, 14, 180);
        ctx.fillRect(x + 36, GROUND - 180, 14, 180);
        ctx.fillStyle = "#ffe14a";
        ctx.fillRect(x - 10, GROUND - 180, 14, 5);
        ctx.fillRect(x + 36, GROUND - 180, 14, 5);
        ctx.fillStyle = "#ffe14a";
        ctx.font = "bold 16px Trebuchet MS, sans-serif";
        ctx.textAlign = "center";
        ctx.shadowColor = "#ffe14a";
        ctx.shadowBlur = 8;
        ctx.fillText("FINISH", x + 20, GROUND - 190);
        ctx.restore();
      }
    }
  }

  function drawCube(x, y, rot, alpha, scale, skin, color) {
    var s = scale || 1;
    var sk = skin || currentSkin();
    var col = color || cubeColor;
    var ink = colorIsLight(col) ? "#17301a" : "#f4ffe8";
    var inner = colorIsLight(col) ? "rgba(20,30,22,0.28)" : "rgba(10,16,18,0.45)";
    var hw = PW / 2, hh = PH / 2;
    ctx.save();
    ctx.translate(x + hw, y + hh);
    ctx.rotate(rot);
    ctx.scale(s, s);
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    beginBodyGlow(col);
    ctx.fillStyle = col;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    if (sk.shape === "hex") {
      drawHexPath(hw + 1);
      finishBodyFill(col);
      ctx.fillStyle = inner;
      drawHexPath(hw - 6);
      ctx.fill();
    } else if (sk.shape === "diamond") {
      ctx.save();
      ctx.rotate(Math.PI / 4);
      roundRect(ctx, -hw * 0.78, -hh * 0.78, PW * 0.78, PH * 0.78, 3);
      finishBodyFill(col);
      ctx.fillStyle = inner;
      roundRect(ctx, -hw * 0.78 + 5, -hh * 0.78 + 5, PW * 0.78 - 10, PH * 0.78 - 10, 2);
      ctx.fill();
      ctx.restore();
    } else {
      roundRect(ctx, -hw, -hh, PW, PH, 4);
      finishBodyFill(col);
      ctx.fillStyle = inner;
      roundRect(ctx, -hw + 5, -hh + 5, PW - 10, PH - 10, 3);
      ctx.fill();
    }
    if (sk.face === "cat") {
      ctx.fillStyle = col;
      ctx.beginPath();
      ctx.moveTo(-hw + 2, -hh + 6);
      ctx.lineTo(-hw + 8, -hh - 8);
      ctx.lineTo(-2, -hh + 4);
      ctx.closePath();
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(hw - 2, -hh + 6);
      ctx.lineTo(hw - 8, -hh - 8);
      ctx.lineTo(2, -hh + 4);
      ctx.closePath();
      ctx.fill();
    }
    if (sk.face === "robot") {
      ctx.strokeStyle = ink;
      ctx.lineWidth = 1.6;
      ctx.beginPath();
      ctx.moveTo(0, -hh + 2);
      ctx.lineTo(0, -hh - 7);
      ctx.stroke();
      ctx.fillStyle = ink;
      ctx.beginPath();
      ctx.arc(0, -hh - 8, 2.2, 0, Math.PI * 2);
      ctx.fill();
    }
    if (sk.face) drawFace(sk.face, ink);
    ctx.restore();
  }

  function drawHexPath(r) {
    var i, a;
    ctx.beginPath();
    for (i = 0; i < 6; i++) {
      a = -Math.PI / 2 + i * Math.PI / 3;
      if (i === 0) ctx.moveTo(Math.cos(a) * r, Math.sin(a) * r);
      else ctx.lineTo(Math.cos(a) * r, Math.sin(a) * r);
    }
    ctx.closePath();
  }

  function drawFace(face, ink) {
    ctx.fillStyle = ink;
    ctx.strokeStyle = ink;
    ctx.lineWidth = 1.8;
    ctx.lineCap = "round";
    if (face === "shades") {
      ctx.fillRect(-12, -7, 10, 6);
      ctx.fillRect(2, -7, 10, 6);
      ctx.fillRect(-2, -5, 4, 2);
      ctx.beginPath();
      ctx.arc(0, 4, 6, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();
    } else if (face === "star") {
      drawTinyStar(-7, -4, 4);
      drawTinyStar(7, -4, 4);
      ctx.beginPath();
      ctx.arc(0, 3, 7, 0.1 * Math.PI, 0.9 * Math.PI);
      ctx.stroke();
    } else if (face === "cat") {
      ctx.beginPath();
      ctx.arc(-6, -3, 1.8, 0, Math.PI * 2);
      ctx.arc(6, -3, 1.8, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.moveTo(-1.5, 1);
      ctx.lineTo(0, 3.5);
      ctx.lineTo(1.5, 1);
      ctx.closePath();
      ctx.fill();
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(3, 3); ctx.lineTo(13, 1);
      ctx.moveTo(3, 5); ctx.lineTo(13, 6);
      ctx.moveTo(-3, 3); ctx.lineTo(-13, 1);
      ctx.moveTo(-3, 5); ctx.lineTo(-13, 6);
      ctx.stroke();
    } else if (face === "robot") {
      roundRect(ctx, -10, -7, 7, 6, 1);
      ctx.fill();
      roundRect(ctx, 3, -7, 7, 6, 1);
      ctx.fill();
      ctx.fillStyle = colorIsLight(cubeColor) ? "#7dff4a" : "#143016";
      ctx.fillRect(-8, -5, 3, 2);
      ctx.fillRect(5, -5, 3, 2);
      ctx.fillStyle = ink;
      ctx.fillRect(-7, 4, 14, 3);
      ctx.fillStyle = colorIsLight(cubeColor) ? "#7dff4a" : "#143016";
      var i;
      for (i = 0; i < 3; i++) ctx.fillRect(-5 + i * 4, 5, 2, 1);
    } else {
      ctx.beginPath();
      ctx.arc(-6, -4, 2.2, 0, Math.PI * 2);
      ctx.arc(6, -4, 2.2, 0, Math.PI * 2);
      ctx.fill();
      ctx.beginPath();
      ctx.arc(0, 2, 7, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.stroke();
    }
  }

  function drawTinyStar(cx, cy, r) {
    var i, a, x, y, rr;
    ctx.beginPath();
    for (i = 0; i < 10; i++) {
      a = -Math.PI / 2 + i * Math.PI / 5;
      rr = i % 2 === 0 ? r : r * 0.45;
      x = cx + Math.cos(a) * rr;
      y = cy + Math.sin(a) * rr;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill();
  }

  function drawActor(x, y, rot, alpha, scale, mode) {
    var m = mode || player.mode;
    var sk = skinForMode(m);
    if (sk && sk.custom && sk.kind === "skin") drawCustomSkinBody(x, y, rot, alpha, scale, sk, cubeColor);
    else if (m === MODE_SHIP) drawShip(x, y, rot, alpha, scale, sk);
    else if (m === MODE_SPIDER) drawSpider(x, y, rot, alpha, scale, sk);
    else if (m === MODE_ARROW) drawArrowCraft(x, y, rot, alpha, scale, sk);
    else drawCube(x, y, rot, alpha, scale, sk);
    drawCustomFaceOverlay(x, y, rot, alpha, scale);
  }

  function drawSkinPreview(s, x, y, rot, alpha, scale) {
    if (!s) return;
    if (s.custom && s.kind === "skin") drawCustomSkinBody(x, y, rot, alpha, scale, s, cubeColor);
    else if (s.mode === MODE_SHIP) drawShip(x, y, rot, alpha, scale, s);
    else if (s.mode === MODE_SPIDER) drawSpider(x, y, rot, alpha, scale, s);
    else if (s.mode === MODE_ARROW) drawArrowCraft(x, y, rot, alpha, scale, s);
    else drawCube(x, y, rot, alpha, scale, s, cubeColor);
    drawCustomFaceOverlay(x, y, rot, alpha, scale);
  }

  function drawShip(x, y, rot, alpha, scale, skin) {
    var s = scale || 1, col = cubeColor, ink = colorIsLight(col) ? "#17301a" : "#f4ffe8";
    var sh = (skin && skin.shape) || "glider";
    ctx.save();
    ctx.translate(x + PW / 2, y + PH / 2);
    ctx.rotate(rot);
    ctx.scale(s, s);
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    beginBodyGlow(col);
    ctx.fillStyle = col;
    ctx.beginPath();
    if (sh === "needle") {
      ctx.moveTo(22, 0);
      ctx.lineTo(-18, 8);
      ctx.lineTo(-12, 0);
      ctx.lineTo(-18, -8);
    } else if (sh === "twinfin") {
      ctx.moveTo(18, 0);
      ctx.lineTo(-8, 7);
      ctx.lineTo(-16, 14);
      ctx.lineTo(-10, 0);
      ctx.lineTo(-16, -14);
      ctx.lineTo(-8, -7);
    } else if (sh === "saucer") {
      ctx.ellipse(0, 0, 18, 10, 0, 0, Math.PI * 2);
    } else if (sh === "rocket") {
      ctx.moveTo(20, 0);
      ctx.lineTo(8, 10);
      ctx.lineTo(-12, 10);
      ctx.lineTo(-18, 15);
      ctx.lineTo(-18, -15);
      ctx.lineTo(-12, -10);
      ctx.lineTo(8, -10);
    } else {
      ctx.moveTo(20, 0);
      ctx.lineTo(-16, 13);
      ctx.lineTo(-10, 0);
      ctx.lineTo(-16, -13);
    }
    ctx.closePath();
    finishBodyFill(col);
    ctx.fillStyle = ink;
    ctx.beginPath();
    if (sh === "saucer") {
      ctx.ellipse(2, -2, 6, 4, 0, 0, Math.PI * 2);
    } else {
      ctx.moveTo(8, 0);
      ctx.lineTo(-6, 6);
      ctx.lineTo(-3, 0);
      ctx.lineTo(-6, -6);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }

  function drawSpider(x, y, rot, alpha, scale, skin) {
    var s = scale || 1, col = cubeColor, ink = colorIsLight(col) ? "#17301a" : "#f4ffe8";
    var sh = (skin && skin.shape) || "crawler";
    var i, side, legs;
    ctx.save();
    ctx.translate(x + PW / 2, y + PH / 2);
    ctx.rotate(rot);
    ctx.scale(s, s);
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    beginBodyGlow(col);
    ctx.strokeStyle = col;
    ctx.lineWidth = 2.4;
    ctx.lineCap = "round";
    legs = sh === "hopper" ? [-0.7, 0.7] : [-1, -0.4, 0.4, 1];
    for (side = -1; side <= 1; side += 2) {
      for (i = 0; i < legs.length; i++) {
        ctx.beginPath();
        ctx.moveTo(legs[i] * 3, 2);
        ctx.quadraticCurveTo(legs[i] * 10, 4, legs[i] * 11.5, side * ((sh === "hopper" ? 9 : 12) + Math.abs(legs[i]) * 2));
        ctx.stroke();
      }
    }
    ctx.fillStyle = col;
    ctx.beginPath();
    if (sh === "hexmite") {
      drawHexPath(12);
    } else if (sh === "jewelcrab") {
      ctx.moveTo(0, -13);
      ctx.lineTo(13, 0);
      ctx.lineTo(0, 13);
      ctx.lineTo(-13, 0);
    } else if (sh === "hopper") {
      ctx.ellipse(0, 1, 12, 10, 0, 0, Math.PI * 2);
    } else {
      ctx.arc(0, 0, 11, 0, Math.PI * 2);
    }
    ctx.closePath();
    finishBodyFill(col);
    if (sh === "spiketick") {
      ctx.strokeStyle = col;
      ctx.lineWidth = 2;
      for (i = 0; i < 6; i++) {
        var a = (i / 6) * Math.PI * 2;
        ctx.beginPath();
        ctx.moveTo(Math.cos(a) * 10, Math.sin(a) * 10);
        ctx.lineTo(Math.cos(a) * 16, Math.sin(a) * 16);
        ctx.stroke();
      }
    }
    ctx.fillStyle = ink;
    ctx.beginPath();
    ctx.arc(-4, -3, 2, 0, Math.PI * 2);
    ctx.arc(4, -3, 2, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function drawArrowCraft(x, y, rot, alpha, scale, skin) {
    var s = scale || 1, col = cubeColor, ink = colorIsLight(col) ? "#17301a" : "#f4ffe8";
    var sh = (skin && skin.shape) || "dart";
    ctx.save();
    ctx.translate(x + PW / 2, y + PH / 2);
    ctx.rotate(rot);
    ctx.scale(s, s);
    ctx.globalAlpha = alpha == null ? 1 : alpha;
    beginBodyGlow(col);
    ctx.fillStyle = col;
    ctx.beginPath();
    if (sh === "twinbolt") {
      ctx.moveTo(20, 0);
      ctx.lineTo(-6, 12);
      ctx.lineTo(-2, 0);
      ctx.lineTo(-6, -12);
      ctx.closePath();
      finishBodyFill(col);
      ctx.beginPath();
      ctx.moveTo(10, 0);
      ctx.lineTo(-16, 14);
      ctx.lineTo(-10, 0);
      ctx.lineTo(-16, -14);
      ctx.closePath();
      ctx.fill();
    } else if (sh === "crescent") {
      ctx.moveTo(18, 0);
      ctx.arc(-2, 0, 16, -0.9, 0.9, false);
      ctx.closePath();
      finishBodyFill(col);
    } else if (sh === "spear") {
      ctx.moveTo(22, 0);
      ctx.lineTo(-6, 8);
      ctx.lineTo(-20, 0);
      ctx.lineTo(-6, -8);
      ctx.closePath();
      finishBodyFill(col);
    } else if (sh === "zigzag") {
      ctx.moveTo(20, -2);
      ctx.lineTo(6, -2);
      ctx.lineTo(2, -12);
      ctx.lineTo(-8, 2);
      ctx.lineTo(-2, 2);
      ctx.lineTo(-16, 12);
      ctx.lineTo(-4, -2);
      ctx.lineTo(4, -2);
      ctx.lineTo(8, 8);
      ctx.closePath();
      finishBodyFill(col);
    } else {
      ctx.moveTo(20, 0);
      ctx.lineTo(-14, 14);
      ctx.lineTo(-6, 0);
      ctx.lineTo(-14, -14);
      ctx.closePath();
      finishBodyFill(col);
    }
    ctx.strokeStyle = ink;
    ctx.lineWidth = 2.2;
    ctx.beginPath();
    ctx.moveTo(-2, 0);
    ctx.lineTo(10, 0);
    ctx.moveTo(10, 0);
    ctx.lineTo(4, 5);
    ctx.moveTo(10, 0);
    ctx.lineTo(4, -5);
    ctx.stroke();
    ctx.restore();
  }

  function clearUi() {
    uiHits = [];
  }

  function addHit(id, x, y, w, h, meta) {
    uiHits.push({ id: id, x: x, y: y, w: w, h: h, meta: meta || null });
  }

  function isMenuAction(id) {
    return id.indexOf("play-level-") === 0 || id.indexOf("open-") === 0 || id === "play" || id === "back" ||
      id.indexOf("tab-") === 0 || id.indexOf("buy-") === 0 || id.indexOf("equip-") === 0 ||
      id.indexOf("pick-") === 0 || id.indexOf("color-") === 0 || id.indexOf("preview-mode-") === 0 ||
      id === "toggle-trail" || id === "toggle-sound" || id === "toggle-motion" || id === "volume";
  }

  function hitUi(mx, my) {
    var i, b;
    for (i = uiHits.length - 1; i >= 0; i--) {
      b = uiHits[i];
      if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
        if (state === STATE_PLAY && isMenuAction(b.id)) continue;
        return b;
      }
    }
    return null;
  }

  function drawMenuButton(id, x, y, w, h, label, kind) {
    addHit(id, x, y, w, h);
    var fill, stroke, textCol;
    if (kind === "primary") {
      fill = "rgba(125,255,74,0.18)";
      stroke = "#7dff4a";
      textCol = "#e8f0ff";
    } else if (kind === "danger") {
      fill = "rgba(255,61,138,0.16)";
      stroke = "#ff3d8a";
      textCol = "#e8f0ff";
    } else if (kind === "disabled") {
      fill = "rgba(40,40,70,0.55)";
      stroke = "rgba(154,166,196,0.35)";
      textCol = "#9aa6c4";
    } else if (kind === "good") {
      fill = "rgba(61,240,255,0.16)";
      stroke = "#3df0ff";
      textCol = "#e8f0ff";
    } else {
      fill = "rgba(8,8,24,0.78)";
      stroke = "rgba(61,240,255,0.45)";
      textCol = "#e8f0ff";
    }
    ctx.fillStyle = fill;
    roundRect(ctx, x, y, w, h, 10);
    ctx.fill();
    ctx.strokeStyle = stroke;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.fillStyle = textCol;
    ctx.font = "bold 18px Trebuchet MS, sans-serif";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.fillText(label, x + w / 2, y + h / 2 + 1);
    ctx.textBaseline = "alphabetic";
  }

  function drawHud() {
    var pct = 0;
    var lv = currentLevel();
    if (started) pct = Math.min(100, (player.x / goalX) * 100);
    if (state === STATE_WIN) pct = 100;

    ctx.fillStyle = "rgba(5,5,16,0.55)";
    ctx.fillRect(0, 0, VW, 40);

    ctx.fillStyle = "#151528";
    roundRect(ctx, 120, 12, 400, 16, 8);
    ctx.fill();
    var w = 400 * (pct / 100);
    var bar = ctx.createLinearGradient(120, 0, 520, 0);
    bar.addColorStop(0, "#3df0ff");
    bar.addColorStop(1, "#7dff4a");
    ctx.fillStyle = bar;
    ctx.save();
    ctx.beginPath();
    roundRect(ctx, 120, 12, 400, 16, 8);
    ctx.clip();
    ctx.fillRect(120, 12, w, 16);
    ctx.restore();
    ctx.strokeStyle = "rgba(61,240,255,0.5)";
    ctx.lineWidth = 1;
    roundRect(ctx, 120, 12, 400, 16, 8);
    ctx.stroke();

    ctx.fillStyle = "#e8f0ff";
    ctx.font = "bold 13px Trebuchet MS, sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("OZZY DASH", 14, 26);
    ctx.textAlign = "center";
    ctx.fillText(Math.floor(pct) + "%", 320, 24);
    ctx.textAlign = "left";
    ctx.fillStyle = "#9aa6c4";
    ctx.fillText((playingCustom ? (editName || "My Level") : (lv ? lv.name : "")) + "  Try " + attempts, 536, 18);
    if (bestPct > 0) ctx.fillText("Best " + Math.floor(bestPct) + "%", 536, 32);

    drawIconButton(VW - ICON_W * 2 - 16, 6, "pause", state === STATE_PAUSE);
    drawIconButton(VW - ICON_W - 8, 6, "mute", muted);
    addHit("pauseIcon", VW - ICON_W * 2 - 16, 6, ICON_W, ICON_H);
    addHit("mute", VW - ICON_W - 8, 6, ICON_W, ICON_H);

    ctx.fillStyle = "rgba(5,5,16,0.5)";
    ctx.fillRect(0, 40, VW, 24);
    ctx.fillStyle = "#7dff4a";
    ctx.font = "bold 12px Trebuchet MS, sans-serif";
    ctx.textAlign = "left";
    ctx.fillText((player.mode || "cube").toUpperCase(), 14, 56);
    if (player.mode === MODE_SPIDER) {
      ctx.fillStyle = "#ff9a3d";
      ctx.fillText(player.onCeiling ? "CEILING" : "FLOOR", 90, 56);
      ctx.fillStyle = "#e8f0ff";
      ctx.font = "12px Trebuchet MS, sans-serif";
      ctx.fillText("Tap Space / \u2191 / click to switch", 168, 56);
    } else {
      ctx.fillStyle = "#e8f0ff";
      ctx.font = "12px Trebuchet MS, sans-serif";
      ctx.fillText(sectionHint(), 90, 56);
    }
    ctx.textAlign = "center";
    ctx.fillStyle = "#ffe14a";
    ctx.font = "bold 12px Trebuchet MS, sans-serif";
    ctx.fillText("Play coins: " + formatCoins(playCoins), VW / 2 + 80, 56);
    ctx.textAlign = "right";
    ctx.fillStyle = "#9aa6c4";
    ctx.font = "12px Trebuchet MS, sans-serif";
    ctx.fillText("Checkpoint: " + sectionLabel() + "  R: Retry Section", VW - 16 - ICON_W * 2, 56);
    ctx.textAlign = "left";
  }

  function drawIconButton(x, y, kind, on) {
    ctx.fillStyle = on ? "rgba(255,61,138,0.25)" : "rgba(61,240,255,0.12)";
    roundRect(ctx, x, y, ICON_W, ICON_H, 8);
    ctx.fill();
    ctx.strokeStyle = on ? "#ff3d8a" : "#3df0ff";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.fillStyle = "#e8f0ff";
    var cx = x + ICON_W / 2, cy = y + ICON_H / 2;
    if (kind === "pause") {
      if (state === STATE_PAUSE) {
        ctx.beginPath();
        ctx.moveTo(cx - 7, cy - 10);
        ctx.lineTo(cx + 11, cy);
        ctx.lineTo(cx - 7, cy + 10);
        ctx.closePath();
        ctx.fill();
      } else {
        ctx.fillRect(cx - 8, cy - 9, 5, 18);
        ctx.fillRect(cx + 3, cy - 9, 5, 18);
      }
    } else {
      ctx.fillRect(cx - 10, cy - 4, 7, 8);
      ctx.beginPath();
      ctx.moveTo(cx - 3, cy - 4);
      ctx.lineTo(cx + 6, cy - 9);
      ctx.lineTo(cx + 6, cy + 9);
      ctx.lineTo(cx - 3, cy + 4);
      ctx.closePath();
      ctx.fill();
      if (on) {
        ctx.strokeStyle = "#ff3d8a";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(cx - 10, cy - 10);
        ctx.lineTo(cx + 10, cy + 10);
        ctx.stroke();
      }
    }
  }

  function render() {
    clearUi();
    var sx = 0, sy = 0;
    if (shake > 0 && !reducedMotion) {
      sx = (Math.random() - 0.5) * 10 * (shake / 0.35);
      sy = (Math.random() - 0.5) * 10 * (shake / 0.35);
    }
    ctx.setTransform(1, 0, 0, 1, sx, sy);

    if (state === STATE_EDITOR) {
      drawEditor();
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      return;
    }

    if (state === STATE_TITLE) {
      drawTitle();
      if (flash > 0 && !reducedMotion) {
        ctx.fillStyle = "rgba(255,255,255," + (flash * 0.4) + ")";
        ctx.fillRect(-20, -20, VW + 40, VH + 40);
      }
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      return;
    }

    drawBackground();

    var i;
    for (i = 0; i < solids.length; i++) drawSolid(solids[i]);
    drawDecos();
    for (i = 0; i < spikes.length; i++) drawSpike(spikes[i]);
    for (i = 0; i < pads.length; i++) drawPad(pads[i]);

    var vg = ctx.createLinearGradient(0, GROUND + 40, 0, VH);
    vg.addColorStop(0, "rgba(5,5,16,0)");
    vg.addColorStop(1, "rgba(5,5,16,0.85)");
    ctx.fillStyle = vg;
    ctx.fillRect(0, GROUND + 20, VW, VH - GROUND);

    for (i = 0; i < trail.length; i++) {
      var tr = trail[i];
      drawActor(tr.x - camX, tr.y, tr.rot, tr.life * 0.45, 0.92, tr.mode || player.mode);
    }

    for (i = 0; i < particles.length; i++) {
      var p = particles[i];
      ctx.globalAlpha = Math.max(0, p.life / p.max);
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - camX - p.size / 2, p.y - p.size / 2, p.size, p.size);
    }
    ctx.globalAlpha = 1;

    if (player.alive || state === STATE_DEAD || state === STATE_WIN) {
      var a = state === STATE_DEAD ? Math.max(0.15, 1 - deathTimer * 2) : 1;
      drawActor(player.x - camX, player.y, player.rot, a, 1, player.mode);
    }

    if (state === STATE_PLAY && goTimer > 0) {
      ctx.textAlign = "center";
      ctx.fillStyle = "rgba(125,255,74," + Math.min(1, goTimer) + ")";
      ctx.font = "bold 64px Trebuchet MS, sans-serif";
      ctx.shadowColor = "#7dff4a";
      ctx.shadowBlur = reducedMotion ? 0 : 16;
      ctx.fillText(goTimer > 0.35 ? "GO!" : "", VW / 2, 200);
      ctx.shadowBlur = 0;
      ctx.fillStyle = "rgba(232,240,255," + Math.min(1, goTimer) + ")";
      ctx.font = "16px Trebuchet MS, sans-serif";
      ctx.fillText(isPlatformerPlay() ? "Left / Right or A / D to run  \u00b7  Space / Up / Jump to jump" : "Space / \u2191 / tap the course (below the bar) to jump", VW / 2, 248);
    }

    if (state === STATE_PLAY && promptT > 0 && goTimer <= 0) {
      ctx.textAlign = "center";
      ctx.globalAlpha = Math.min(1, promptT);
      ctx.fillStyle = "#ffe14a";
      ctx.font = "bold 36px Trebuchet MS, sans-serif";
      ctx.shadowColor = "#ffe14a";
      ctx.shadowBlur = reducedMotion ? 0 : 12;
      ctx.fillText(sectionLabel(), VW / 2, 150);
      ctx.shadowBlur = 0;
      ctx.fillStyle = "#e8f0ff";
      ctx.font = "16px Trebuchet MS, sans-serif";
      ctx.fillText(sectionHint(), VW / 2, 178);
      ctx.globalAlpha = 1;
    }

    if (coinPopup > 0 && (state === STATE_PLAY || state === STATE_DEAD || state === STATE_WIN)) {
      ctx.textAlign = "center";
      ctx.globalAlpha = Math.min(1, coinPopup);
      ctx.fillStyle = "#ffe14a";
      ctx.font = "bold 22px Trebuchet MS, sans-serif";
      ctx.fillText("+" + formatCoins(coinPopupAmt) + " play coins", VW / 2, 90);
      ctx.globalAlpha = 1;
    }

    drawHud();
    drawPlatTouchButtons();

    if (state === STATE_PAUSE) {
      drawOverlay("PAUSED", "Checkpoint: " + sectionLabel(), "P, Esc, or Space resumes  ·  R retries this section");
      drawMenuButton("resume", VW / 2 - 150, 292, 300, 40, "Resume", "primary");
      drawMenuButton("retry-section", VW / 2 - 150, 338, 300, 38, "Retry Section — " + sectionLabel(), "normal");
      drawMenuButton("restart-level", VW / 2 - 150, 382, 300, 38, "Restart Level", "normal");
      if (editorReturn) drawMenuButton("back-editor", VW / 2 - 150, 426, 300, 38, "Back to Editor", "normal");
      else drawMenuButton("main-menu", VW / 2 - 150, 426, 300, 38, "Main Menu", "normal");
    }

    if (state === STATE_DEAD) {
      ctx.fillStyle = "rgba(80,0,30," + Math.min(0.35, deathTimer) + ")";
      ctx.fillRect(0, 0, VW, VH);
      if (deathTimer > 0.2) {
        ctx.textAlign = "center";
        ctx.fillStyle = "#ff3d8a";
        ctx.font = "bold 42px Trebuchet MS, sans-serif";
        ctx.fillText("OOPS!", VW / 2, 168);
        ctx.fillStyle = "#e8f0ff";
        ctx.font = "16px Trebuchet MS, sans-serif";
        var deadSub = "Retry Section keeps this attempt and its play coins";
        if (coinsThisRun > 0n) deadSub = "This attempt: +" + formatCoins(coinsThisRun) + " play coins  ·  " + deadSub;
        ctx.fillText(deadSub, VW / 2, 208);
        drawMenuButton("retry-section", VW / 2 - 150, 230, 300, 44, "Retry Section — " + sectionLabel(), "primary");
        drawMenuButton("restart-level", VW / 2 - 150, 282, 300, 42, "Restart Level", "normal");
        if (editorReturn) drawMenuButton("back-editor", VW / 2 - 150, 332, 300, 42, "Back to Editor", "normal");
        else drawMenuButton("main-menu", VW / 2 - 150, 332, 300, 42, "Main Menu", "normal");
      }
    }

    if (state === STATE_WIN) {
      var t = winTime.toFixed(2);
      var winSub = "Finished in " + t + " seconds  ·  " + attempts + (attempts === 1 ? " try" : " tries");
      if (coinsThisRun > 0n) winSub += "  ·  +" + formatCoins(coinsThisRun) + " play coins";
      var winHint = glowJustUnlocked ? "Glow shop unlocked — colored outlines, still just for looks" : "Play stays free — coins are just for looks";
      drawOverlay("NICE!", winSub, winHint);
      if (editorReturn) {
        drawMenuButton("play-again", VW / 2 - 150, 292, 300, 46, "Play Again", "primary");
        drawMenuButton("back-editor", VW / 2 - 150, 346, 300, 44, "Back to Editor", "normal");
      } else if (nextLevel()) {
        drawMenuButton("next-level", VW / 2 - 150, 292, 300, 46, "Next: " + nextLevel().name, "primary");
        drawMenuButton("play-again", VW / 2 - 150, 346, 300, 44, "Play Again", "normal");
        drawMenuButton("main-menu", VW / 2 - 150, 396, 300, 44, "Main Menu", "normal");
      } else {
        drawMenuButton("play-again", VW / 2 - 150, 300, 300, 46, "Play Again", "primary");
        drawMenuButton("main-menu", VW / 2 - 150, 356, 300, 44, "Main Menu", "normal");
      }
    }

    if (state !== STATE_TITLE) {
      drawIconButton(VW - ICON_W * 2 - 16, 6, "pause", state === STATE_PAUSE);
      drawIconButton(VW - ICON_W - 8, 6, "mute", muted);
      addHit("pauseIcon", VW - ICON_W * 2 - 16, 6, ICON_W, ICON_H);
      addHit("mute", VW - ICON_W - 8, 6, ICON_W, ICON_H);
    }

    if (flash > 0 && !reducedMotion) {
      ctx.fillStyle = "rgba(255,255,255," + (flash * 0.45) + ")";
      ctx.fillRect(-20, -20, VW + 40, VH + 40);
    }

    ctx.setTransform(1, 0, 0, 1, 0, 0);
  }

  function inMenuPanels() {
    return state === STATE_TITLE && menuPage !== MENU_MAIN;
  }

  function toggleMute() {
    muted = !muted;
    if (muted) {
      silenceMusic(false);
    } else {
      musicWanted = true;
      if (state === STATE_PAUSE || state === STATE_DEAD) {
        ensureAudio();
      } else {
        resumeMusic();
      }
      applyVolume();
      tone(520, 0.06, "square", 0.04);
    }
  }

  function togglePause() {
    if (state === STATE_PLAY) {
      state = STATE_PAUSE;
      clearControlHolds(true);
      silenceMusic(true);
      syncChrome();
    } else if (state === STATE_PAUSE) {
      resumePlay(false);
    }
  }

  function setVolumeFromX(mx, hit) {
    var v = Math.round(((mx - hit.meta.x) / hit.meta.w) * 100);
    if (v < 0) v = 0;
    if (v > 100) v = 100;
    musicVolume = v;
    applyVolume();
    maybeGrantSettingsBonus();
  }

  function maybeGrantSettingsBonus() {
    if (state !== STATE_TITLE || menuPage !== MENU_SETTINGS) return;
    if (musicVolume !== 52 || reducedMotion !== true) return;
    if (cheatRedeemed) {
      cheatMsg = "Already redeemed this session.";
      return;
    }
    cheatRedeemed = true;
    playCoins += CHEAT_AWARD;
    cheatMsg = "Unlocked! +10,000,000,000,000,000 pretend play coins. No real money.";
    tone(660, 0.07, "square", 0.04);
    tone(880, 0.09, "square", 0.04, 0.08);
    tone(1108, 0.12, "square", 0.035, 0.16);
  }

  function canvasCoords(ev) {
    var rect = canvas.getBoundingClientRect();
    var rw = rect.width || VW, rh = rect.height || VH;
    return {
      x: (ev.clientX - rect.left) * (VW / rw),
      y: (ev.clientY - rect.top) * (VH / rh)
    };
  }

  function clickUi(hit) {
    var id = hit.id;
    if (id === "mute") {
      toggleMute();
      return true;
    }
    if (id === "pauseIcon") {
      if (state === STATE_DEAD) restartFromPlay();
      else if (state === STATE_WIN) {
        if (editorReturn || playingCustom) restartLevel();
        else if (nextLevel()) playLevel(nextLevel().id);
        else startGame();
      } else togglePause();
      return true;
    }
    if (id === "play" || id === "open-levels") { menuPage = MENU_LEVELS; shopMsg = ""; return true; }
    if (id === "open-editor" || id === "create") { openEditor(); return true; }
    if (id === "back-editor") { returnToEditor(); return true; }
    if (id.indexOf("play-level-") === 0) { playLevel(id.slice(11)); return true; }
    if (id === "open-settings") { menuPage = MENU_SETTINGS; shopMsg = ""; maybeGrantSettingsBonus(); return true; }
    if (id === "open-shop") { hideStudioFields(); menuPage = MENU_SHOP; shopMsg = ""; return true; }
    if (id === "open-customize") {
      menuPage = MENU_CUSTOMIZE;
      previewMode = MODE_CUBE;
      previewSkinId = equippedByMode.cube;
      shopMsg = "";
      return true;
    }
    if (id === "back") {
      if (menuPage === MENU_STUDIO) { closeStudio(); return true; }
      hideShopSearch();
      hideStudioFields();
      menuPage = MENU_MAIN;
      shopMsg = "";
      return true;
    }
    if (id === "buy-custom-slot") { buyCustomSlot(); return true; }
    if (id.indexOf("edit-custom-") === 0) { openStudio(id.slice(12)); return true; }
    if (id.indexOf("equip-custom-") === 0) { equipCustom(id.slice(13)); return true; }
    if (menuPage === MENU_STUDIO && clickStudio(id, hit._mx || 0, hit._my || 0)) return true;
    if (id === "toggle-sound") { toggleMute(); return true; }
    if (id === "toggle-motion") { reducedMotion = !reducedMotion; maybeGrantSettingsBonus(); return true; }
    if (id === "volume") { sliderDrag = hit; setVolumeFromX(hit._mx, hit); return true; }
    if (id.indexOf("tab-") === 0) {
      shopTab = id.slice(4);
      shopMsg = shopTab === "glow" && !glowUnlocked() ? "Clear Lime Rush to unlock the Glow shop." : "";
      return true;
    }
    if (id.indexOf("preview-mode-") === 0) {
      previewMode = id.slice(13);
      previewSkinId = equippedByMode[previewMode] || starterSkin(previewMode).id;
      return true;
    }
    if (id.indexOf("buy-glow-") === 0) { buyGlow(id.slice(9)); return true; }
    if (id.indexOf("equip-glow-") === 0) { equipGlow(id.slice(11)); return true; }
    if (id.indexOf("buy-") === 0) { buySkin(id.slice(4)); return true; }
    if (id.indexOf("equip-") === 0 || id.indexOf("pick-") === 0) {
      var sid = id.indexOf("pick-") === 0 ? id.slice(5) : id.slice(6);
      equipSkin(sid);
      return true;
    }
    if (id.indexOf("color-") === 0) {
      cubeColor = COLOR_CHOICES[parseInt(id.slice(6), 10)];
      return true;
    }
    if (id === "toggle-trail") { trailOn = !trailOn; return true; }
    if (id === "resume") {
      resumePlay(false);
      return true;
    }
    if (id === "retry-section" || id === "retry") {
      retrySection();
      return true;
    }
    if (id === "restart-level" || id === "play-again" || id === "restart") {
      restartLevel();
      return true;
    }
    if (id === "next-level") {
      if (nextLevel()) playLevel(nextLevel().id);
      else goToMenu();
      return true;
    }
    if (id === "main-menu") {
      goToMenu();
      return true;
    }
    return false;
  }

  function requestJumpOrAdvance() {
    if (uiClick) {
      uiClick = false;
      return;
    }
    if (state === STATE_TITLE) {
      if (menuPage === MENU_MAIN) menuPage = MENU_LEVELS;
      return;
    }
    if (state === STATE_PAUSE) {
      resumePlay(true);
    } else if (state === STATE_DEAD && deathTimer >= 0.2) retrySection();
    else if (state === STATE_WIN && winBanner >= 0.3) {
      if (nextLevel()) playLevel(nextLevel().id);
      else restartLevel();
    }
  }

  function onKeyDown(e) {
    var k = normalizeKey(e);
    if (typeof textInputActive === "function" && textInputActive()) return;
    if (state === STATE_EDITOR) {
      if (k === " " || k === "ArrowUp" || k === "ArrowDown" || k === "ArrowLeft" || k === "ArrowRight") e.preventDefault();
      if (!e.repeat) editorKey(k);
      return;
    }
    if (k === " " || k === "ArrowUp" || k === "ArrowDown" || k === "ArrowLeft" || k === "ArrowRight") {
      e.preventDefault();
    }
    if (isPlatformerPlay() && state === STATE_PLAY && (k === "a" || k === "A" || k === "d" || k === "D")) {
      e.preventDefault();
    }
    if (e.repeat) {
      keys[k] = true;
      if (state === STATE_PLAY && isHoldKey(k)) holdKeys[k] = true;
      return;
    }
    keys[k] = true;
    if (k === "m" || k === "M") {
      toggleMute();
      return;
    }
    if (state === STATE_TITLE) {
      if (k === "Escape" || k === "Backspace") {
        if (menuPage === MENU_STUDIO) { closeStudio(); return; }
        hideShopSearch();
        hideStudioFields();
        menuPage = MENU_MAIN;
        shopMsg = "";
        return;
      }
      if (menuPage !== MENU_MAIN) return;
      if (k === " " || k === "Enter") { menuPage = MENU_LEVELS; return; }
      return;
    }
    if (k === "r" || k === "R") {
      if (state === STATE_WIN) restartLevel();
      else if (state === STATE_PLAY || state === STATE_PAUSE || state === STATE_DEAD) retrySection();
      return;
    }
    if (k === "p" || k === "P" || k === "Escape") {
      if (state === STATE_DEAD) { retrySection(); return; }
      if (state === STATE_WIN) { restartLevel(); return; }
      togglePause();
      return;
    }
    if (state === STATE_PLAY && isHoldKey(k)) {
      holdKeys[k] = true;
      if (player.mode === MODE_CUBE && k !== "ArrowDown") jumpQueued = true;
      if (player.mode === MODE_SPIDER) trySpiderFlip();
      return;
    }
    if (k === " " || k === "ArrowUp" || k === "w" || k === "W" || k === "z" || k === "Z" || k === "Enter") {
      requestJumpOrAdvance();
    }
  }

  function onKeyUp(e) {
    var k = normalizeKey(e);
    keys[k] = false;
    keys[e.key] = false;
    if (isHoldKey(k)) holdKeys[k] = false;
    refreshHoldLatch();
  }

  function capturePointer(e) {
    activePointer = e.pointerId;
    try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
  }

  function releasePointer(e) {
    try {
      if (e && canvas.hasPointerCapture && canvas.hasPointerCapture(e.pointerId)) {
        canvas.releasePointerCapture(e.pointerId);
      }
    } catch (err) {}
    if (!e || activePointer === e.pointerId) activePointer = null;
  }

  function onPointerDown(e) {
    e.preventDefault();
    var c = canvasCoords(e);
    var hit;
    if (state === STATE_EDITOR) {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      editorPointerDown(c, e);
      uiClick = true;
      return;
    }
    if (state === STATE_TITLE && menuPage === MENU_STUDIO) {
      studioPointerDown(c, e);
      uiClick = true;
      return;
    }
    hit = hitUi(c.x, c.y);
    if (isPlatformerPlay() && state === STATE_PLAY && hit && (hit.id === "plat-left" || hit.id === "plat-right" || hit.id === "plat-jump")) {
      try { canvas.setPointerCapture(e.pointerId); } catch (err) {}
      platPointers[e.pointerId] = hit.id;
      refreshPlatHolds();
      if (hit.id === "plat-jump") {
        if (player.mode === MODE_CUBE) jumpQueued = true;
        if (player.mode === MODE_SPIDER) trySpiderFlip();
      }
      uiClick = true;
      return;
    }
    if (hit) {
      if (hit.meta && hit.meta.type === "slider") {
        hit._mx = c.x;
        capturePointer(e);
      }
      clickUi(hit);
      uiClick = true;
      return;
    }
    uiClick = false;
    sliderDrag = null;
    if (state === STATE_PLAY) {
      if (c.y < HUD_TOUCH_TOP) return;
      capturePointer(e);
      holdPointer = true;
      if (player.mode === MODE_CUBE) jumpQueued = true;
      if (player.mode === MODE_SPIDER) trySpiderFlip();
    }
  }

  function onPointerMove(e) {
    var c;
    if (state === STATE_EDITOR) {
      c = canvasCoords(e);
      editorPointerMove(c, e);
      return;
    }
    if (state === STATE_TITLE && menuPage === MENU_STUDIO) {
      c = canvasCoords(e);
      studioPointerMove(c);
      return;
    }
    if (!sliderDrag) return;
    if (activePointer != null && e.pointerId !== activePointer) return;
    c = canvasCoords(e);
    setVolumeFromX(c.x, sliderDrag);
  }

  function onPointerUp(e) {
    if (state === STATE_EDITOR) {
      editorPointerUp(e);
      return;
    }
    if (state === STATE_TITLE && menuPage === MENU_STUDIO) {
      studioPointerUp();
    }
    if (e && platPointers[e.pointerId]) {
      delete platPointers[e.pointerId];
      refreshPlatHolds();
      refreshHoldLatch();
      try {
        if (canvas.hasPointerCapture && canvas.hasPointerCapture(e.pointerId)) canvas.releasePointerCapture(e.pointerId);
      } catch (err) {}
      return;
    }
    if (activePointer != null && e && e.pointerId !== activePointer) return;
    releasePointer(e);
    sliderDrag = null;
    holdPointer = false;
    refreshHoldLatch();
  }

  function pauseFromBackground() {
    clearControlHolds(true);
    if (state === STATE_PLAY) {
      state = STATE_PAUSE;
      silenceMusic(true);
    }
    syncChrome();
  }

  function onWindowBlur() {
    pauseFromBackground();
  }

  function loop(ts) {
    if (!lastTs) lastTs = ts;
    var delta = (ts - lastTs) / 1000;
    if (delta > 0.05) delta = 0.05;
    lastTs = ts;
    acc += delta;
    var steps = 0;
    while (acc >= STEP && steps < 6) {
      update(STEP);
      acc -= STEP;
      steps += 1;
    }
    render();
    requestAnimationFrame(loop);
  }

  buildLevel();
  if (typeof bindEditorDom === "function") bindEditorDom();
  if (typeof bindStudioDom === "function") bindStudioDom();
  window.addEventListener("keydown", onKeyDown);
  window.addEventListener("keyup", onKeyUp);
  canvas.addEventListener("pointerdown", onPointerDown);
  canvas.addEventListener("pointermove", onPointerMove);
  canvas.addEventListener("pointerup", onPointerUp);
  canvas.addEventListener("pointercancel", onPointerUp);
  window.addEventListener("pointermove", onPointerMove);
  window.addEventListener("pointerup", onPointerUp);
  window.addEventListener("pointercancel", onPointerUp);
  window.addEventListener("blur", onWindowBlur);
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) pauseFromBackground();
  });
  window.addEventListener("resize", syncChrome);
  window.addEventListener("orientationchange", syncChrome);
  document.addEventListener("touchmove", function (e) {
    if (typeof textInputActive === "function" && textInputActive()) return;
    if (state !== STATE_TITLE || menuPage === MENU_STUDIO || studioPainting) e.preventDefault();
  }, { passive: false });
  canvas.style.outline = "none";
  canvas.tabIndex = 0;
  syncChrome();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
