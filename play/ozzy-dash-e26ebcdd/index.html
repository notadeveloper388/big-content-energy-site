<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Ozzy Dash</title>
<style>
  :root { color-scheme: dark; }
  html, body {
    margin: 0;
    height: 100%;
    height: 100dvh;
    background: #050510;
    overflow: hidden;
    overscroll-behavior: none;
    font-family: "Trebuchet MS", "Segoe UI", "Arial Black", sans-serif;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    -webkit-text-size-adjust: 100%;
  }
  body.menu-scroll {
    overflow: auto;
    touch-action: pan-y;
    overscroll-behavior: contain;
  }
  #wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100%;
    min-height: 100dvh;
    width: 100%;
    box-sizing: border-box;
    padding: max(6px, env(safe-area-inset-top, 0px)) max(6px, env(safe-area-inset-right, 0px)) max(6px, env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px));
  }
  #rotateHint {
    display: none;
    box-sizing: border-box;
    width: min(100%, 520px);
    margin: 0 0 8px;
    padding: 8px 12px;
    border-radius: 10px;
    background: rgba(8, 8, 24, 0.92);
    border: 1px solid rgba(61, 240, 255, 0.35);
    color: #e8f0ff;
    font-size: 14px;
    line-height: 1.35;
    text-align: center;
  }
  #rotateHint strong { color: #ffe14a; }
  body.portrait #rotateHint { display: block; }
  canvas {
    display: block;
    width: min(100%, calc((100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 48px) * 960 / 540));
    height: auto;
    max-width: 100%;
    max-height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 48px);
    aspect-ratio: 960 / 540;
    background: #060614;
    border-radius: 10px;
    box-shadow: 0 0 80px rgba(61, 240, 255, 0.12), 0 0 0 1px rgba(61, 240, 255, 0.2);
    touch-action: none;
  }
  body.portrait canvas {
    width: min(100%, calc((100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 80px) * 960 / 540));
    max-height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 80px);
  }
  body.editor-mode {
    overflow: hidden;
    touch-action: none;
  }
  #editName, #editCodeBox {
    display: none;
    position: fixed;
    z-index: 5;
    box-sizing: border-box;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    color: #e8f0ff;
    background: #151528;
    border: 1px solid rgba(61, 240, 255, 0.45);
    border-radius: 8px;
  }
  #editName {
    height: 36px;
    padding: 4px 10px;
    font-size: 16px;
  }
  #editCodeBox {
    padding: 12px;
    width: min(520px, 90vw);
    flex-direction: column;
    gap: 8px;
    background: rgba(8, 8, 24, 0.96);
  }
  #editCodeBox.show { display: flex; }
  #editName.show { display: block; }
  #editCodeBox textarea {
    width: 100%;
    min-height: 120px;
    max-height: 200px;
    box-sizing: border-box;
    padding: 8px;
    font: 13px ui-monospace, Menlo, Consolas, monospace;
    color: #e8f0ff;
    background: #0b0b22;
    border: 1px solid rgba(61, 240, 255, 0.35);
    border-radius: 6px;
  }
  #editCodeBox .row { display: flex; gap: 8px; flex-wrap: wrap; }
  #editCodeBox button {
    min-height: 44px;
    padding: 8px 14px;
    font-size: 15px;
    color: #e8f0ff;
    background: #1c1c3a;
    border: 1px solid rgba(61, 240, 255, 0.45);
    border-radius: 8px;
  }
  #editCodeBox p { margin: 0 0 4px; font-size: 14px; color: #9aa6c4; }
  #editName, #editCode, #editCodeBox textarea,
  #shopSearch, #studioName, #studioColor {
    user-select: text;
    -webkit-user-select: text;
    touch-action: auto;
  }
  body.studio-mode { overflow: hidden; touch-action: none; }
  #shopSearch, #studioName, #studioColor {
    display: none;
    position: fixed;
    z-index: 5;
    box-sizing: border-box;
    font-family: "Trebuchet MS", "Segoe UI", sans-serif;
    color: #e8f0ff;
    background: #151528;
    border: 1px solid rgba(61, 240, 255, 0.45);
    border-radius: 8px;
    padding: 4px 10px;
    font-size: 16px;
    height: 36px;
  }
  #shopSearch.show, #studioName.show, #studioColor.show { display: block; }
  #studioColor { padding: 2px; min-width: 44px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="rotateHint">Rotate your device for a wider view. The full course stays visible either way — nothing is cropped.</div>
  <canvas id="game" width="960" height="540" aria-label="Ozzy Dash. Main menu with Play, Create, Settings, Skin Shop, Customize, and six levels. Create opens a local level editor. Modes: cube jump, ship hold to fly up, spider tap to switch floor and ceiling, arrow hold to go down and release to go up. R retries the section. P pauses. M: music + sound."></canvas>
  <input id="editName" class="" type="text" maxlength="24" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Level name" aria-label="Custom level name">
  <input id="shopSearch" type="search" maxlength="40" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Search shop" aria-label="Search shop items">
  <input id="studioName" type="text" maxlength="24" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Slot name" aria-label="Custom slot name">
  <input id="studioColor" type="color" value="#7dff4a" aria-label="Paint color">
  <div id="editCodeBox" role="dialog" aria-label="Export or import level code">
    <p id="editCodeTitle">Level code</p>
    <textarea id="editCode" maxlength="10000" autocomplete="off" spellcheck="false" placeholder="Paste a level code here"></textarea>
    <div class="row">
      <button type="button" id="editCodeApply">Import</button>
      <button type="button" id="editCodeCopy">Select all</button>
      <button type="button" id="editCodeClose">Close</button>
    </div>
  </div>
</div>
<script>
(function () {
  "use strict";

  // Ozzy Dash — original auto-run jump game.
  // Not affiliated with Geometry Dash, RobTop Games, or any official title.
  // Fully offline: no network, imports, analytics, or external assets.
  // Draft v5: level creator (Create menu, grid editor, test, export/import codes),
  // per-level Platformer Mode, Custom Skin Studio in the shop, plus all v4.1 features.
  // Cube landing uses visual feet so the 28x28 hazard box can sit above the floor without losing ground.
  // Cube jump: hold or buffer re-jumps on landing (keydown edges alone miss e.repeat holds).
  // Settings unlock: volume exactly 52 and Reduced Motion on, once per session.
  // Player hazard hitbox is a centered 28x28 box inside the 36x36 sprite (77.8% per side).
  // Section mode comes from the furthest crossed portal only; never re-enter earlier portals.
  // Arrow: default diagonal UP; hold Down/Up/click (or Space/W/Z) for diagonal DOWN; release = UP.
  // Wallet uses BigInt so huge pretend coin amounts stay exact.
  // Session-only play coins, skins, glow, and level clears; no storage APIs or real-money purchases.
  // SFX nodes are not on the music stop-list, so death/UI beeps are not cut off.
  // Not a recreation of any copyrighted song. No external assets or network.
  // Logical playfield is always 960x540, letterboxed to the screen. No orientation lock.

  var TILE = 40;
  var VW = 960;
  var VH = 540;
  var GROUND = 400;
  var SPEED = 320;          // px/s = 8 tiles/s, easier pacing (~46s course)
  var PLAT_ACCEL = 2200;
  var PLAT_FRICTION = 2600;
  var PLAT_MAX = 320;
  var platHoldLeft = false;
  var platHoldRight = false;
  var platHoldJump = false;
  var platPointers = Object.create(null);
  var GRAVITY = 2000;       // px/s^2
  var JUMP_V = -780;        // jump height = 152.1 px (3.80 tiles)
  var PAD_V = -960;
  var AIR_TIME = 2 * 780 / 2000; // 0.78 s; jump distance = 249.6 px (6.24 tiles)
  var PW = 36;              // visual sprite size
  var PH = 36;
  var HIT_INSET = 4;        // consistent hazard/collision inset on each side
  var HIT_W = 28;           // 28/36 = 77.8% of visual width
  var HIT_H = 28;           // 28/36 = 77.8% of visual height
  var COYOTE = 0.07;
  var BUFFER = 0.12;
  var STEP = 1 / 60;

  var START_TX = 5;
  var GOAL_TX = 370;
  var VOID_Y = 530;
  var SHIP_FALL = 720;
  var SHIP_THRUST = -1280;
  var SHIP_MAX_VY = 320;
  var ARROW_SLOPE = 0.42;   // vy = +/- 134.4; no gravity
  var MODE_SAFE = 0.6;
  var CORRIDOR_TOP = 80;
  var SPIDER_CEIL = 100;
  var MODE_CUBE = "cube";
  var MODE_SHIP = "ship";
  var MODE_SPIDER = "spider";
  var MODE_ARROW = "arrow";
  var HUD_TOUCH_TOP = 64;
  var ICON_W = 56;
  var ICON_H = 48;

  var canvas = document.getElementById("game");
  var ctx = canvas.getContext("2d");
  var rotateHint = document.getElementById("rotateHint");

  var STATE_TITLE = 0;
  var STATE_PLAY = 1;
  var STATE_PAUSE = 2;
  var STATE_DEAD = 3;
  var STATE_WIN = 4;
  var STATE_EDITOR = 5;

  var state = STATE_TITLE;
  var muted = true;
  var audioCtx = null;
  var attempts = 0;
  var runTime = 0;
  var bestPct = 0;
  var winTime = 0;
  var deathTimer = 0;
  var shake = 0;
  var flash = 0;
  var goTimer = 0;
  var titleTime = 0;
  var winBanner = 0;
  var camX = 0;
  var lastTs = 0;
  var acc = 0;
  var started = false;

  var keys = Object.create(null);
  var jumpQueued = false;
  var uiClick = false;
  var holdPointer = false;
  var holdKeys = Object.create(null);
  var holdLatch = false;
  var spiderLock = false;
  var spiderQueued = false;
  var modeSafeT = 0;
  var promptT = 0;
  var currentCheckpoint = 0;
  var portals = [];
  var checkpoints = [];
  var spiderCeilY = SPIDER_CEIL;
  var spiderFloorY = GROUND;
  var cheatRedeemed = false;
  var cheatMsg = "";
  var CHEAT_AWARD = 10000000000000000n;
  var activePointer = null;

  var MENU_MAIN = "main";
  var MENU_SETTINGS = "settings";
  var MENU_SHOP = "shop";
  var MENU_CUSTOMIZE = "customize";
  var MENU_LEVELS = "levels";
  var menuPage = MENU_MAIN;
  var playingCustom = false;
  var editorReturn = false;
  var customCoinsGiven = 0n;
  var uiHits = [];
  var sliderDrag = null;
  var shopMsg = "";
  var shopTab = "cube";
  var coinPopup = 0;
  var coinPopupAmt = 0;
  var playCoins = 0n;
  var coinsThisRun = 0n;
  var milestonesHit = 0;
  var COIN_MILESTONES = [
    { pct: 25, coins: 10n },
    { pct: 50, coins: 15n },
    { pct: 75, coins: 20n },
    { pct: 100, coins: 30n }
  ];
  var musicVolume = 80;
  var reducedMotion = false;
  var cubeColor = "#7dff4a";
  var trailOn = true;
  var previewSkinId = "buddy";
  var previewMode = "cube";
  var equippedByMode = { cube: "buddy", ship: "glider", spider: "ember", arrow: "dart" };
  var equippedGlow = "none";
  var selectedLevelId = "lime-rush";
  var levelsCleared = Object.create(null);
  var bestByLevel = Object.create(null);
  var glowJustUnlocked = false;

  var SKINS = [
    { id: "buddy", name: "Lime Buddy", mode: "cube", cost: 0n, owned: true, shape: "cube", face: "smile" },
    { id: "shades", name: "Cool Shades", mode: "cube", cost: 20n, owned: false, shape: "cube", face: "shades" },
    { id: "starry", name: "Star Eyes", mode: "cube", cost: 25n, owned: false, shape: "cube", face: "star" },
    { id: "kitty", name: "Kitty Cube", mode: "cube", cost: 30n, owned: false, shape: "cube", face: "cat" },
    { id: "hex", name: "Hex Hero", mode: "cube", cost: 35n, owned: false, shape: "hex", face: "smile" },
    { id: "diamond", name: "Diamond Dash", mode: "cube", cost: 40n, owned: false, shape: "diamond", face: "smile" },
    { id: "robo", name: "Robo Rock", mode: "cube", cost: 45n, owned: false, shape: "cube", face: "robot" },
    { id: "glider", name: "Glider Wing", mode: "ship", cost: 0n, owned: true, shape: "glider" },
    { id: "needle", name: "Needle Jet", mode: "ship", cost: 20n, owned: false, shape: "needle" },
    { id: "twinfin", name: "Twin Fin", mode: "ship", cost: 30n, owned: false, shape: "twinfin" },
    { id: "saucer", name: "Saucer Hop", mode: "ship", cost: 35n, owned: false, shape: "saucer" },
    { id: "rocket", name: "Rocket Pod", mode: "ship", cost: 40n, owned: false, shape: "rocket" },
    { id: "ember", name: "Ember Crawler", mode: "spider", cost: 0n, owned: true, shape: "crawler" },
    { id: "hopper", name: "Dot Hopper", mode: "spider", cost: 20n, owned: false, shape: "hopper" },
    { id: "hexmite", name: "Hex Mite", mode: "spider", cost: 30n, owned: false, shape: "hexmite" },
    { id: "spiketick", name: "Spike Tick", mode: "spider", cost: 35n, owned: false, shape: "spiketick" },
    { id: "jewelcrab", name: "Jewel Crab", mode: "spider", cost: 40n, owned: false, shape: "jewelcrab" },
    { id: "dart", name: "Lime Dart", mode: "arrow", cost: 0n, owned: true, shape: "dart" },
    { id: "twinbolt", name: "Twin Bolt", mode: "arrow", cost: 20n, owned: false, shape: "twinbolt" },
    { id: "crescent", name: "Crescent", mode: "arrow", cost: 30n, owned: false, shape: "crescent" },
    { id: "spear", name: "Prism Spear", mode: "arrow", cost: 35n, owned: false, shape: "spear" },
    { id: "zigzag", name: "Zig Zag", mode: "arrow", cost: 40n, owned: false, shape: "zigzag" }
  ];
  var GLOWS = [
    { id: "none", name: "No Glow", cost: 0n, owned: true, color: null },
    { id: "outline-cyan", name: "Cyan Line", cost: 25n, owned: false, color: "#3df0ff" },
    { id: "outline-gold", name: "Gold Line", cost: 30n, owned: false, color: "#ffe14a" },
    { id: "outline-magenta", name: "Magenta Line", cost: 30n, owned: false, color: "#ff3d8a" },
    { id: "outline-violet", name: "Violet Line", cost: 35n, owned: false, color: "#b58cff" },
    { id: "outline-white", name: "White Line", cost: 35n, owned: false, color: "#f2f2ff" },
    { id: "outline-orange", name: "Ember Line", cost: 40n, owned: false, color: "#ff9a3d" },
    { id: "outline-mint", name: "Mint Line", cost: 40n, owned: false, color: "#7dff4a" }
  ];
  var COLOR_CHOICES = ["#7dff4a", "#3df0ff", "#ff3d8a", "#ffe14a", "#ff9a3d", "#f2f2ff", "#7a8cff", "#ff6ad5"];

  var solids = [];
  var spikes = [];
  var pads = [];
  var decos = [];
  var particles = [];
  var trail = [];
  var goalX = GOAL_TX * TILE;
  var levelEnd = 270 * TILE;

  var player = {
    x: START_TX * TILE,
    y: GROUND - PH,
    vx: 0,
    vy: 0,
    rot: 0,
    rotTarget: 0,
    onGround: true,
    wasGround: true,
    coyote: 0,
    jumpBuf: 0,
    alive: true,
    mode: "cube",
    onCeiling: false
  };

  var CUBE_HINT = "Jump — Space / \u2191 / tap";
  var SHIP_HINT = "Hold to fly up; release to go down";
  var SPIDER_HINT = "Tap Space / \u2191 / click to switch floor and ceiling";
  var ARROW_HINT = "Hold \u2193 / \u2191 / click to go down; release to go up";

  function plat(x0, x1, rise, thick) {
    var top = GROUND - rise * TILE;
    var h = (thick == null ? Math.max(160, VH - top) : thick * TILE);
    solids.push({ x: x0 * TILE, y: top, w: (x1 - x0) * TILE, h: h, rise: rise, face: "top" });
  }

  function addSolid(x0, x1, y, h, face) {
    solids.push({ x: x0 * TILE, y: y, w: (x1 - x0) * TILE, h: h, face: face || "top" });
  }

  function ceilBand(x0, x1, bottomY) {
    addSolid(x0, x1, 0, bottomY, "bottom");
  }

  function floorBand(x0, x1, topY) {
    addSolid(x0, x1, topY, VH - topY + 40, "top");
  }

  function spikeDownAt(tx, ceilBottom) {
    spikes.push({ x: tx * TILE, y: ceilBottom, w: TILE, h: TILE, dir: "down" });
  }

  function spikeUp(tx, rise) {
    var top = GROUND - rise * TILE;
    spikes.push({
      x: tx * TILE,
      y: top - TILE,
      w: TILE,
      h: TILE,
      dir: "up"
    });
  }

  function spikeDown(tx, tipFromGround) {
    var tipY = GROUND - tipFromGround;
    var h = 88;
    spikes.push({
      x: tx * TILE,
      y: tipY - h,
      w: TILE,
      h: h,
      dir: "down"
    });
  }

  function padAt(tx, rise) {
    var top = GROUND - rise * TILE;
    pads.push({
      x: tx * TILE + 4,
      y: top - 10,
      w: TILE - 8,
      h: 12,
      used: false
    });
  }

  function addPortal(tx, mode, name, hint, spawnY, onCeiling) {
    var x = tx * TILE;
    portals.push({ x: x, mode: mode, name: name, hint: hint, spawnY: spawnY, onCeiling: !!onCeiling });
    decos.push({ type: "portal", x: x, mode: mode, name: name, hint: hint });
  }

  function addCheckpoint(name, mode, x, y, onCeiling, hint) {
    checkpoints.push({ name: name, mode: mode, x: x, y: y, onCeiling: !!onCeiling, hint: hint });
  }

  function finishCourse(goalTx, endTx) {
    goalX = goalTx * TILE;
    levelEnd = (endTx || goalTx + 20) * TILE;
    decos.push({ type: "goal", x: goalX });
  }

  function openCube(nameHint) {
    addCheckpoint("Cube", MODE_CUBE, START_TX * TILE, GROUND - PH, false, nameHint || CUBE_HINT);
  }

  function portalShip(tx, spawnY) {
    addPortal(tx, MODE_SHIP, "SHIP", SHIP_HINT, spawnY, false);
    addCheckpoint("Ship", MODE_SHIP, tx * TILE + 24, spawnY, false, SHIP_HINT);
  }

  function portalSpider(tx, onCeil) {
    var y = onCeil ? spiderCeilY : spiderFloorY - PH;
    addPortal(tx, MODE_SPIDER, "SPIDER", SPIDER_HINT, y, !!onCeil);
    addCheckpoint("Spider", MODE_SPIDER, tx * TILE + 24, y, !!onCeil, SPIDER_HINT);
  }

  function portalArrow(tx, spawnY) {
    addPortal(tx, MODE_ARROW, "ARROW", ARROW_HINT, spawnY, false);
    addCheckpoint("Arrow", MODE_ARROW, tx * TILE + 24, spawnY, false, ARROW_HINT);
  }

  function portalCube(tx) {
    addPortal(tx, MODE_CUBE, "CUBE", CUBE_HINT, GROUND - PH, false);
    addCheckpoint("Cube", MODE_CUBE, tx * TILE + 24, GROUND - PH, false, CUBE_HINT);
  }

  // ===== Level 1 Lime Rush (original fixed course) =====
  // Duration (370-5)/8 = 45.625s. Cube 0-96 (12s), Ship 96-192 (12s),
  // Spider 192-280 (11s), Arrow 280-370 (11.25s).
  function buildLimeRush() {
    openCube(CUBE_HINT);
    plat(0, 28, 0);
    spikeUp(16, 0);
    spikeUp(22, 0);
    plat(30, 50, 0);
    spikeUp(38, 0);
    spikeUp(44, 0);
    plat(53, 66, 1, 1.5);
    spikeUp(60, 1);
    plat(69, 82, 2, 1.6);
    plat(84, 192, 0);

    portalShip(96, 210);
    ceilBand(96, 192, CORRIDOR_TOP);
    addSolid(118, 124, 300, 140, "top");
    addSolid(136, 142, CORRIDOR_TOP, 120, "bottom");
    addSolid(156, 161, 305, 140, "top");
    addSolid(174, 180, CORRIDOR_TOP, 125, "bottom");

    portalSpider(192, false);
    floorBand(192, 280, GROUND);
    ceilBand(192, 280, SPIDER_CEIL);
    spikeUp(218, 0);
    spikeUp(219, 0);
    spikeUp(220, 0);
    spikeDownAt(236, SPIDER_CEIL);
    spikeDownAt(237, SPIDER_CEIL);
    spikeDownAt(238, SPIDER_CEIL);
    spikeUp(254, 0);
    spikeUp(255, 0);
    spikeUp(256, 0);
    spikeDownAt(270, SPIDER_CEIL);
    spikeDownAt(271, SPIDER_CEIL);
    spikeDownAt(272, SPIDER_CEIL);

    portalArrow(280, 230);
    floorBand(280, 370, GROUND);
    ceilBand(280, 298, 50);
    ceilBand(298, 370, CORRIDOR_TOP);
    // First hang 306-314, bottom 130. After level-flight ends ~296, ~10 tiles of
    // preview plus (230-130)/134.4 = 0.74s to hold. Opening under: 270px.
    addSolid(306, 314, CORRIDOR_TOP, 50, "bottom");
    // Floor pillar 326-334, top 250. Twelve tiles to rise after the hang. Opening 170px.
    addSolid(326, 334, 250, 200, "top");
    addSolid(346, 353, CORRIDOR_TOP, 70, "bottom");
    addSolid(360, 365, 260, 180, "top");

    floorBand(368, 390, GROUND);
    finishCourse(370, 390);
  }

  // ===== Level 2 Ember Steps =====
  // Duration (310-5)/8 = 38.125s. Cube 0-120 (15s), Ship 120-184 (8s),
  // Spider 184-244 (7.5s), Arrow 244-310 (8.25s). Slightly busier cube, still fair.
  // Cube gaps are 4 tiles (160px) vs jump distance 249.6px.
  function buildEmberSteps() {
    openCube(CUBE_HINT);
    plat(0, 26, 0);
    spikeUp(12, 0);
    spikeUp(18, 0);
    plat(30, 48, 0);
    spikeUp(38, 0);
    plat(52, 68, 1, 1.5);
    spikeUp(60, 1);
    plat(72, 88, 2, 1.6);
    plat(92, 120, 0);
    spikeUp(100, 0);
    spikeUp(108, 0);

  function asCoins(n) {
    if (typeof n === "bigint") return n;
    if (typeof n === "number") return BigInt(Math.trunc(n));
    return BigInt(n || 0);
  }

  function formatCoins(n) {
    var v = asCoins(n);
    var neg = v < 0n;
    if (neg) v = -v;
    try {
      return (neg ? "-" : "") + v.toLocaleString("en-US");
    } catch (err) {
      var s = v.toString(), out = "", i, c = 0;
      for (i = s.length - 1; i >= 0; i--) {
        if (c === 3) { out = "," + out; c = 0; }
        out = s.charAt(i) + out;
        c += 1;
      }
      return (neg ? "-" : "") + out;
    }
  }

    return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

  function pointInTri(px, py, a, b, c) {
    var v0x = c.x - a.x, v0y = c.y - a.y;
    var v1x = b.x - a.x, v1y = b.y - a.y;
    var v2x = px - a.x, v2y = py - a.y;
    var dot00 = v0x * v0x + v0y * v0y;
    var dot01 = v0x * v1x + v0y * v1y;
    var dot02 = v0x * v2x + v0y * v2y;
    var dot11 = v1x * v1x + v1y * v1y;
    var dot12 = v1x * v2x + v1y * v2y;
    var den = dot00 * dot11 - dot01 * dot01;
    if (den === 0) return false;
    var u = (dot11 * dot02 - dot01 * dot12) / den;
    var v = (dot00 * dot12 - dot01 * dot02) / den;
    return u >= 0 && v >= 0 && u + v <= 1;

  function segHit(ax, ay, bx, by, cx, cy, dx, dy) {
    var r = { x: bx - ax, y: by - ay };
    var s = { x: dx - cx, y: dy - cy };
    var den = r.x * s.y - r.y * s.x;
    if (den === 0) return false;
    var t = ((cx - ax) * s.y - (cy - ay) * s.x) / den;
    var u = ((cx - ax) * r.y - (cy - ay) * r.x) / den;

  function rectHitsTri(r, a, b, c) {
    if (pointInTri(r.x, r.y, a, b, c) ||
        pointInTri(r.x + r.w, r.y, a, b, c) ||
        pointInTri(r.x, r.y + r.h, a, b, c) ||
        pointInTri(r.x + r.w, r.y + r.h, a, b, c)) return true;
    if (a.x >= r.x && a.x <= r.x + r.w && a.y >= r.y && a.y <= r.y + r.h) return true;
    if (b.x >= r.x && b.x <= r.x + r.w && b.y >= r.y && b.y <= r.y + r.h) return true;
    if (c.x >= r.x && c.x <= r.x + r.w && c.y >= r.y && c.y <= r.y + r.h) return true;
    var corners = [
      [r.x, r.y, r.x + r.w, r.y],
      [r.x + r.w, r.y, r.x + r.w, r.y + r.h],
      [r.x + r.w, r.y + r.h, r.x, r.y + r.h],
      [r.x, r.y + r.h, r.x, r.y]
    ];
    var edges = [[a, b], [b, c], [c, a]];
    var i, j;
    for (i = 0; i < 4; i++) {
      for (j = 0; j < 3; j++) {
        if (segHit(corners[i][0], corners[i][1], corners[i][2], corners[i][3],

    }
    return false;
  }

  function spikeHits(box, sp) {
    // Inset hitbox so edges are a little more forgiving than the art.
    var ix = 8, it = 6, ib = 3;
    var a, b, c;
    if (sp.dir === "up") {
      a = { x: sp.x + sp.w / 2, y: sp.y + it };
      b = { x: sp.x + ix, y: sp.y + sp.h - ib };
      c = { x: sp.x + sp.w - ix, y: sp.y + sp.h - ib };
    } else {
      a = { x: sp.x + sp.w / 2, y: sp.y + sp.h - it };
      b = { x: sp.x + ix, y: sp.y + ib };
      c = { x: sp.x + sp.w - ix, y: sp.y + ib };

    return rectHitsTri(box, a, b, c);

  function burst(x, y, color, n, speed) {

      var a = Math.random() * Math.PI * 2;
      var v = (Math.random() * 0.7 + 0.3) * (speed || 220);
      particles.push({
        x: x, y: y,
        vx: Math.cos(a) * v,
        vy: Math.sin(a) * v - 40,
        life: 0.35 + Math.random() * 0.35,
        max: 0.7,
        size: 2 + Math.random() * 3,
        color: color

    }
  }

  function doJump() {
    player.vy = JUMP_V;
    player.onGround = false;
    player.coyote = 0;
    player.jumpBuf = 0;

    tone(660, 0.07, "square", 0.045);
    burst(player.x + PW / 2, player.y + PH, cubeColor, 6, 120);

  function doPad() {

    tone(1170, 0.1, "square", 0.04, 0.06);

  function kill() {

    flash = reducedMotion ? 0 : 0.28;
    var pct = Math.min(100, (player.x / goalX) * 100);

    burst(player.x + PW / 2, player.y + PH / 2, "#ffe14a", 8, 200);

    flash = reducedMotion ? 0 : 0.2;

    tone(523, 0.12, "square", 0.05);
    tone(659, 0.12, "square", 0.05, 0.12);
    tone(784, 0.12, "square", 0.05, 0.24);

  // --- Original soundtrack: "Lime Hook" (128 BPM, 16-bar loop) ---

  var MUSIC_BPM = 128;
  var MUSIC_STEP = 60 / MUSIC_BPM / 4;
  var MUSIC_STEPS = 16 * 16;
  var MUSIC_AHEAD = 0.18;
  var MUSIC_LEVEL = 0.58;
  var musicWanted = false;
  var musicOn = false;

      [71, 73, 76, 78, 76, 73, 71, 69],

      [74, 76, 78, 0, 76, 73, 69, 0],
      [81, 0, 81, 78, 76, 0, 73, 0],
      [78, 81, 83, 85, 83, 81, 78, 76],
      [76, 76, 78, 81, 83, 81, 78, 76],
      [85, 83, 81, 78, 76, 74, 73, 76],
      [88, 85, 83, 81, 83, 81, 78, 76],
      [74, 76, 78, 81, 76, 73, 69, 0]

      [42, 42, 54, 42, 42, 45, 49, 42],

      [45, 57, 45, 57, 45, 45, 57, 45],
      [45, 45, 57, 45, 49, 45, 42, 45],
      [38, 38, 50, 38, 50, 45, 38, 50],
      [40, 52, 40, 47, 40, 40, 52, 40],
      [45, 45, 57, 45, 45, 45, 57, 45],
      [42, 42, 54, 42, 54, 49, 42, 54],

  function midiFreq(m) {

  function trackNode(node) {

  }

    var i, n, t;

      try { n.disconnect(); } catch (err) {}

  }

  function buildAudioGraph(ac) {

    masterGain = ac.createGain();
    masterGain.gain.value = Math.max(0.0001, 0.38 * (musicVolume / 100));
    compressor = ac.createDynamicsCompressor();
    compressor.threshold.value = -18;
    compressor.knee.value = 10;
    compressor.ratio.value = 6;
    compressor.attack.value = 0.003;
    compressor.release.value = 0.14;
    musicFilter = ac.createBiquadFilter();
    musicFilter.type = "lowpass";
    musicFilter.frequency.value = 2900;
    musicFilter.Q.value = 0.55;
    musicGain = ac.createGain();
    musicGain.gain.value = 0.0001;
    sfxGain = ac.createGain();
    sfxGain.gain.value = 0.7;
    musicGain.connect(musicFilter);
    musicFilter.connect(compressor);
    sfxGain.connect(compressor);
    compressor.connect(masterGain);
    masterGain.connect(ac.destination);
    noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
    var data = noiseBuf.getChannelData(0);

  function ensureAudio() {
    if (muted) return null;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      if (!audioCtx) audioCtx = new AC();
      buildAudioGraph(audioCtx);
      buildTune();
      if (audioCtx.state === "suspended") audioCtx.resume();
      return audioCtx;
    } catch (err) {
      return null;
    }

  function tone(freq, dur, type, vol, delay) {
    var ac = ensureAudio();
    if (!ac || !sfxGain) return;
    try {
      var t0 = ac.currentTime + (delay || 0);
      var osc = ac.createOscillator();
      var gain = ac.createGain();
      osc.type = type || "square";
      osc.frequency.setValueAtTime(freq, t0);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(Math.max(0.0001, vol || 0.04), t0 + 0.006);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      osc.connect(gain);
      gain.connect(sfxGain);
      osc.start(t0);
      osc.stop(t0 + dur + 0.03);
    } catch (err) {}
  }

  function envGain(ac, peak, t0, attack, dur, dest) {
    var g = ac.createGain();
    var a = Math.max(0.004, attack);
    var d = Math.max(a + 0.02, dur);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(Math.max(0.0001, peak), t0 + a);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + d);
    g.connect(dest);
    return g;
  }

  function playOsc(kind, freq, t0, dur, peak, dest, slideTo) {
    var ac = audioCtx;
    var osc = ac.createOscillator();
    osc.type = kind;
    osc.frequency.setValueAtTime(freq, t0);
    if (slideTo) osc.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
    var g = envGain(ac, peak, t0, 0.008, dur, dest);
    osc.connect(g);
    trackNode(osc);
    osc.start(t0);
    osc.stop(t0 + dur + 0.03);
  }

  function playNoise(t0, dur, peak, hipass, dest) {

    var src = ac.createBufferSource();
    src.buffer = noiseBuf;
    var f = ac.createBiquadFilter();
    f.type = "highpass";
    f.frequency.value = hipass;
    var g = envGain(ac, peak, t0, 0.004, dur, dest);
    src.connect(f);
    f.connect(g);
    trackNode(src);
    src.start(t0);
    src.stop(t0 + dur + 0.03);
  }

  function schedKick(t0) {
    playOsc("sine", 148, t0, 0.13, 0.2, musicGain, 42);
  }

  function schedSnare(t0) {
    playNoise(t0, 0.09, 0.07, 1200, musicGain);
    playOsc("triangle", 190, t0, 0.06, 0.035, musicGain, 120);
  }

  function schedHat(t0, open) {
    playNoise(t0, open ? 0.07 : 0.028, open ? 0.03 : 0.018, open ? 5000 : 7000, musicGain);
  }

  function schedLead(t0, midi, dur) {
    var f = midiFreq(midi);
    playOsc("square", f, t0, dur, 0.042, musicGain, 0);
    playOsc("triangle", f, t0, dur, 0.05, musicGain, 0);
  }

  function schedHarm(t0, midi, dur) {
    var h = HARM_THIRD[midi];
    if (!h) return;
    playOsc("triangle", midiFreq(h), t0, dur, 0.028, musicGain, 0);
  }

  function schedBass(t0, midi, dur) {
    var f = midiFreq(midi);
    playOsc("triangle", f, t0, dur, 0.12, musicGain, 0);
    playOsc("square", f, t0, dur * 0.85, 0.035, musicGain, 0);
  }

  function scheduleStep(step, t0) {
    var bar = Math.floor(step / 16);
    var six = step % 16;
    var dur8 = MUSIC_STEP * 1.72;
    var lead = leadPat[step];
    var bass = bassPat[step];
    var variation = bar >= 8;

    if (six === 0 || six === 8) schedKick(t0);
    if (variation && six === 4) schedKick(t0);
    if ((bar === 7 || bar === 15) && (six === 10 || six === 13 || six === 14)) schedKick(t0);

    if (six === 4 || six === 12) schedSnare(t0);
    if ((bar === 7 || bar === 15) && six === 14) schedSnare(t0 + MUSIC_STEP * 0.5);

    if (variation) {
      if (six % 2 === 0) schedHat(t0, false);
      else schedHat(t0, six === 15);
    } else if (six % 2 === 0) {
      schedHat(t0, six === 14);
    }

    if (bass) schedBass(t0, bass, dur8);
    if (lead) {
      schedLead(t0, lead, dur8);
      if (bar <= 2 || bar === 6 || bar === 12 || bar === 13) schedHarm(t0, lead, dur8);
    }

  function musicScheduler() {
    if (!musicOn || muted || !audioCtx) return;
    var now = audioCtx.currentTime;
    if (nextStepTime < now - 0.2) nextStepTime = now;
    while (nextStepTime < now + MUSIC_AHEAD) {
      scheduleStep(stepIndex, nextStepTime);
      stepIndex = (stepIndex + 1) % MUSIC_STEPS;
      nextStepTime += MUSIC_STEP;

  function silenceMusic(keepWanted) {

      clearTimeout(musicTimer);
      musicTimer = null;

      musicWanted = true;
      savedStep = stepIndex % MUSIC_STEPS;
    } else {
      musicWanted = false;
    }
    if (audioCtx && musicGain) {
      var now = audioCtx.currentTime;
      var v = musicGain.gain.value;
      if (v < 0.0001) v = 0.0001;
      try {
        musicGain.gain.cancelScheduledValues(now);
        musicGain.gain.setValueAtTime(v, now);
        musicGain.gain.linearRampToValueAtTime(0.0001, now + 0.08);

      stopLiveNodes();

  function resumeMusic() {
    if (muted) return;
    if (!ensureAudio() || !musicGain) return;
    if (musicOn) return;
    if (stopNodesTimer) {
      clearTimeout(stopNodesTimer);
      stopNodesTimer = null;
    }
    stopLiveNodes();
    var now = audioCtx.currentTime;
    try {
      musicGain.gain.cancelScheduledValues(now);
      musicGain.gain.setValueAtTime(0.0001, now);
      musicGain.gain.linearRampToValueAtTime(MUSIC_LEVEL, now + 0.07);
    } catch (err) {}

    nextStepTime = now + 0.04;
    musicOn = true;
    musicWanted = true;
    musicScheduler();
  }


  function performSpiderFlip() {
    spiderLock = true;
    spiderQueued = false;
    player.onCeiling = !player.onCeiling;
    attachSpider();
    burst(player.x + PW / 2, player.y + PH / 2, cubeColor, 8, 160);
    tone(500, 0.05, "square", 0.03);
  }

  function trySpiderFlip() {
    if (state !== STATE_PLAY || player.mode !== MODE_SPIDER) return;
    if (holdLatch || spiderLock) return;
    if (modeSafeT > 0) {
      spiderQueued = true;
      return;
    }
    performSpiderFlip();
  }


  function platLeftHeld() {
    return !!(platHoldLeft || keys.ArrowLeft || keys.a || keys.A);
  }

  function platRightHeld() {
    return !!(platHoldRight || keys.ArrowRight || keys.d || keys.D);
  }

  function platJumpHeld() {
    return !!(platHoldJump || cubeJumpHeld());
  }

  function refreshPlatHolds() {
    var id, role;
    platHoldLeft = false;
    platHoldRight = false;
    platHoldJump = false;
    for (id in platPointers) {
      role = platPointers[id];
      if (role === "plat-left") platHoldLeft = true;
      if (role === "plat-right") platHoldRight = true;
      if (role === "plat-jump") platHoldJump = true;
    }
  }

  function applyPlatformerMove(dt, mode) {
    var wish = 0, maxX;
    if (platLeftHeld()) wish -= 1;
    if (platRightHeld()) wish += 1;
    if (wish !== 0) {
      player.vx += wish * PLAT_ACCEL * dt;
      if (player.vx > PLAT_MAX) player.vx = PLAT_MAX;
      if (player.vx < -PLAT_MAX) player.vx = -PLAT_MAX;
    } else {
      if (player.vx > 0) player.vx = Math.max(0, player.vx - PLAT_FRICTION * dt);
      else if (player.vx < 0) player.vx = Math.min(0, player.vx + PLAT_FRICTION * dt);
    }
    if (mode === MODE_SHIP) {
      if (modeSafeT > 0) player.vy *= Math.max(0, 1 - dt * 8);
      else if (shipHeld()) player.vy += SHIP_THRUST * dt;
      else player.vy += SHIP_FALL * dt;
      if (player.vy > SHIP_MAX_VY) player.vy = SHIP_MAX_VY;
      if (player.vy < -SHIP_MAX_VY) player.vy = -SHIP_MAX_VY;
      player.rot = player.vy / SHIP_MAX_VY * 0.45;
    } else if (mode === MODE_ARROW) {
      if (modeSafeT > 0) player.vy = 0;
      else if (platJumpHeld()) player.vy = -ARROW_SLOPE * SPEED;
      else if (keys.ArrowDown) player.vy = ARROW_SLOPE * SPEED;
      else player.vy = 0;
      player.rot = Math.atan2(player.vy, player.vx !== 0 ? player.vx : PLAT_MAX);
    } else if (mode !== MODE_SPIDER) {
      player.vy += GRAVITY * dt;
    }
    player.x += player.vx * dt;
    if (player.x < 0) { player.x = 0; player.vx = 0; }
    maxX = Math.max(TILE, (typeof editLength === "number" ? editLength * TILE : levelEnd) - PW);
    if (typeof goalX === "number") maxX = Math.max(maxX, goalX + TILE * 6);
    if (player.x > maxX) { player.x = maxX; player.vx = 0; }
    if (mode === MODE_SPIDER) attachSpider();
    else player.y += player.vy * dt;
  }

  function resolvePlatformerSolid(s, prevX, prevY) {
    var box, prevBox, horiz, overlapX, overlapY, fromLeft, fromAbove;
    horiz = player.x + HIT_INSET < s.x + s.w && player.x + HIT_INSET + HIT_W > s.x;
    if (player.mode === MODE_CUBE && horiz && player.vy >= 0 && (prevY + PH) <= s.y + 2 && player.y + PH >= s.y - 1) {
      player.y = s.y - PH;
      player.vy = 0;
      player.onGround = true;
      return;
    }
    if (player.mode === MODE_SPIDER && isSpiderAttachSolid(s)) {
      attachSpider();
      if (!player.onCeiling) player.onGround = true;
      return;
    }
    box = bodyBox(player.x, player.y);
    if (!aabb(box, s)) return;
    prevBox = bodyBox(prevX, prevY);
    overlapX = Math.min(box.x + box.w, s.x + s.w) - Math.max(box.x, s.x);
    overlapY = Math.min(box.y + box.h, s.y + s.h) - Math.max(box.y, s.y);
    fromLeft = prevBox.x + prevBox.w <= s.x + 1.5;
    fromAbove = prevBox.y + prevBox.h <= s.y + 1.5;

  function placeOrErase(tx, ty, erasing) {
    var tool = toolCat(editTool);

    if (erasing || tool.cat === "erase") {

      beginEditStroke();
      editItems = editItems.filter(function (e) { return !(e.x === tx && e.y === ty); });
      editConfirmClear = false;

    if (tool.cat === "pan") return;

      editMsg = "Item cap reached (" + EDIT_MAX_ITEMS + ").";
      return;
    }
    next = { t: tool.cat, x: tx, y: ty };
    if (tool.cat === "portal") {
      next.t = "portal";
      next.mode = tool.mode;
    }
    unique = next.t === "finish";
    for (i = 0; i < editItems.length; i++) {
      it = editItems[i];
      if (it.x === tx && it.y === ty && it.t === next.t && (it.mode || "") === (next.mode || "")) return;
    }
    beginEditStroke();
    if (unique) {
      editItems = editItems.filter(function (e) { return e.t !== "finish"; });
    }
    if (sameSolidKind(next.t)) {
      editItems = editItems.filter(function (e) {

  function cubeSectionsForWarn() {
    var ports = [], i, it, ranges, start, mode, next;
    for (i = 0; i < editItems.length; i++) {
      it = editItems[i];
      if (it.t === "portal") ports.push({ x: it.x, mode: it.mode });

    ranges = [];

    mode = MODE_CUBE;
    for (i = 0; i < ports.length; i++) {
      if (mode === MODE_CUBE) ranges.push({ a: start, b: ports[i].x });
      start = ports[i].x;
      mode = ports[i].mode;
    }
    next = finishTx();
    if (next < 0) next = editLength;
    if (mode === MODE_CUBE) ranges.push({ a: start, b: next });
    return ranges;

  function warnImpossibleJumps() {
    var ranges = cubeSectionsForWarn(), r, i, j, plats, a, b, gap, riseGap, msg = "";
    var jumpTiles = 6.24, jumpRise = 3.8;
    function platsIn(a0, a1) {
      var list = [], k, it;
      for (k = 0; k < editItems.length; k++) {
        it = editItems[k];
        if ((it.t === "plat" || it.t === "block") && it.x >= a0 && it.x < a1) list.push(it);
      }
      list.sort(function (p, q) { return p.x - q.x || p.y - q.y; });
      return list;
    }
    for (r = 0; r < ranges.length; r++) {
      plats = platsIn(ranges[r].a, ranges[r].b);
      if (!plats.length && ranges[r].b - ranges[r].a > jumpTiles) {
        return "Warning: cube section starting at tile " + ranges[r].a + " has no floor. Test is still allowed.";
      }
      for (i = 0; i < plats.length; i++) {
        a = plats[i];
        for (j = i + 1; j < plats.length; j++) {
          b = plats[j];
          if (b.x <= a.x) continue;
          if (b.x > a.x + 1) {
            gap = b.x - (a.x + 1);
            riseGap = Math.abs(b.y - a.y);
            if (gap > jumpTiles && riseGap <= jumpRise) {
              msg = "Warning: cube gap at tile " + (a.x + 1) + " is " + gap + " tiles (jump reach is 6.24). Test is still allowed.";
              return msg;
            }
            if (b.y - a.y > jumpRise) {
              msg = "Warning: cube rise at tile " + b.x + " is " + (b.y - a.y) + " tiles (jump height is 3.80). Test is still allowed.";
              return msg;
            }
            break;
          }
        }

  function codeChecksum(s) {
    var h = 5381, i;
    for (i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0;
    return ("00000000" + h.toString(16)).slice(-8);
  }

  function typeChar(it) {
    if (it.t === "spikeUp") return "U";
    if (it.t === "spikeDown") return "D";
    if (it.t === "block") return "B";
    if (it.t === "plat") return "P";
    if (it.t === "pad") return "J";
    if (it.t === "check") return "X";
    if (it.t === "finish") return "F";
    if (it.t === "portal") {
      if (it.mode === MODE_CUBE) return "C";
      if (it.mode === MODE_SHIP) return "H";
      if (it.mode === MODE_SPIDER) return "R";
      if (it.mode === MODE_ARROW) return "A";
    }
    return "";
  }

  function charType(ch) {
    if (ch === "U") return { t: "spikeUp" };
    if (ch === "D") return { t: "spikeDown" };
    if (ch === "B") return { t: "block" };
    if (ch === "P") return { t: "plat" };
    if (ch === "J") return { t: "pad" };
    if (ch === "X") return { t: "check" };
    if (ch === "F") return { t: "finish" };
    if (ch === "C") return { t: "portal", mode: MODE_CUBE };
    if (ch === "H") return { t: "portal", mode: MODE_SHIP };
    if (ch === "R") return { t: "portal", mode: MODE_SPIDER };
    if (ch === "A") return { t: "portal", mode: MODE_ARROW };
    return null;
  }

  function exportEditorCode() {
    var i, it, ch, parts = [], payload, sum, name;
    readEditName();
    name = sanitizeEditName(editName).replace(/ /g, "_");
    editItems.sort(function (a, b) { return a.x - b.x || a.y - b.y; });
    for (i = 0; i < editItems.length; i++) {
      it = editItems[i];
      ch = typeChar(it);
      if (!ch) continue;
      parts.push(ch + ":" + it.x + ":" + it.y);
    }
    payload = "OZZY5|1|" + name + "|" + editLength + "|" + (editPlatformer ? "P" : "-") + "|" + parts.join(",");
    sum = codeChecksum(payload);
    return payload + "|" + sum;
  }

  function importEditorCode(raw) {
    var s, bits, name, len, body, sum, expect, items, recs, i, rec, typ, x, y, flags, plat;
    s = String(raw || "").replace(/^\s+|\s+$/g, "");
    if (!s) return "Paste a level code first.";
    if (s.length > EDIT_MAX_CODE) return "Code is too long.";
    if (s.indexOf("{") >= 0 || s.indexOf("%") >= 0) return "Code contains unsupported characters.";
    bits = s.split("|");
    if (bits.length !== 6 && bits.length !== 7) return "Malformed code.";
    if (bits[0] !== "OZZY5" || bits[1] !== "1") return "Unknown or unsupported code version.";
    name = bits[2];
    len = parseInt(bits[3], 10);
    if (bits.length === 7) {
      flags = bits[4];
      body = bits[5];

      if (flags !== "-" && flags !== "P") return "Unknown flags in code.";
      plat = flags === "P";
    } else {
      flags = "-";
      body = bits[4];
      sum = bits[5].toLowerCase();
      plat = false;
    }
    if (!/^[A-Za-z0-9_-]{1,24}$/.test(name)) return "Name in code is not valid.";
    if (!(len >= EDIT_MIN_LEN && len <= EDIT_MAX_LEN)) return "Level length in code is out of range.";
    if (!/^[0-9a-f]{8}$/.test(sum)) return "Checksum is not valid.";
    expect = bits.slice(0, bits.length - 1).join("|");
    if (codeChecksum(expect) !== sum) return "Checksum failed. The code may be mistyped.";
    items = [];
    if (body) {
      recs = body.split(",");
      if (recs.length > EDIT_MAX_ITEMS) return "Too many items.";
      for (i = 0; i < recs.length; i++) {
        rec = recs[i].split(":");
        if (rec.length !== 3) return "Malformed item at " + (i + 1) + ".";
        typ = charType(rec[0]);
        x = parseInt(rec[1], 10);
        y = parseInt(rec[2], 10);
        if (!typ || rec[0].length !== 1) return "Unknown tile type in item " + (i + 1) + ".";
        if (!(x >= 0 && x < len) || !(y >= 0 && y <= EDIT_ROW_MAX)) return "Item " + (i + 1) + " is out of bounds.";
        typ.x = x;
        typ.y = y;
        items.push(typ);
      }
    }
    pushEditUndo();
    editName = sanitizeEditName(name.replace(/_/g, " "));
    editLength = len;
    editItems = items;
    editPlatformer = plat;
    editCamX = 0;
    syncEditNameField();
    return "";
  }

  function clickEditor(id, mx, my) {
    var cell, erasing;
    if (editSettingsOpen) {
      if (id === "editor-plat-toggle") {
        pushEditUndo();
        editPlatformer = !editPlatformer;
        editMsg = editPlatformer ? "Platformer Mode on for this level." : "Platformer Mode off. This level auto-runs.";
        return true;
      }
      if (id === "editor-settings-close" || id === "editor-settings" || id === "editor-settings-bg") {
        editSettingsOpen = false;
        syncEditNameField();
        return true;
      }
      return true;
    }
    if (id === "editor-back") { closeEditor(); return true; }
    if (id === "editor-settings") { editSettingsOpen = true; hideEditName(); hideEditCode(); return true; }
    if (id === "editor-test") { startCustomTest(); return true; }
    if (id === "editor-undo") { undoEditor(); return true; }
    if (id === "editor-export") { showEditCode("export"); return true; }
    if (id === "editor-import") { showEditCode("import"); return true; }
    if (id === "editor-len-down") { changeEditLength(-10); return true; }
    if (id === "editor-len-up") { changeEditLength(10); return true; }
    if (id === "editor-pan-left") { panEditor(-TILE * 4); return true; }
    if (id === "editor-pan-right") { panEditor(TILE * 4); return true; }
    if (id === "editor-clear") {
      if (!editConfirmClear) {
        editConfirmClear = true;
        editMsg = "Press Clear again to confirm. This cannot be undone except with Undo.";
        return true;
      }
      pushEditUndo();
      editItems = [];
      editConfirmClear = false;
      editMsg = "Cleared.";
      return true;
    }
    if (id.indexOf("place-") === 0 || id === "erase" || id === "pan") {
      editTool = id;
      editConfirmClear = false;
      return true;
    }
    if (id === "editor-grid") {
      if (toolCat(editTool).cat === "pan") return true;
      cell = cellAt(mx, my);
      if (!cell) return true;
      erasing = editTool === "erase";
      placeOrErase(cell.x, cell.y, erasing);
      return true;
    }
    return false;
  }

  function editorPointerDown(c, e) {
    var hit, n, ids;
    if (editorInputActive() && (!editCodeBox || !editCodeBox.classList.contains("show"))) {
      // keep name field, but allow grid clicks to steal focus
    }
    hit = hitUi(c.x, c.y);
    editPointers[e.pointerId] = { x: c.x, y: c.y };
    ids = Object.keys(editPointers);
    if (ids.length >= 2) {
      editPanLast = { x: c.x, y: c.y };
      editDrag = { pan: true, lx: c.x };
      hideEditName();
      return;
    }
    if (hit && hit.id !== "editor-grid") {
      clickEditor(hit.id, c.x, c.y);
      uiClick = true;
      return;
    }
    hideEditName();
    if (toolCat(editTool).cat === "pan" || (e.button && e.button !== 0) || e.shiftKey) {
      editDrag = { pan: true, lx: c.x };
      return;
    }
    if (hit && hit.id === "editor-grid") {
      editDrag = { place: true, lx: c.x, ly: c.y };
      clickEditor("editor-grid", c.x, c.y);
    }
  }

  function editorPointerMove(c, e) {
    var ids, a, b, mid, cell;
    if (editPointers[e.pointerId]) {
      editPointers[e.pointerId].x = c.x;
      editPointers[e.pointerId].y = c.y;
    }
    ids = Object.keys(editPointers);
    if (ids.length >= 2) {
      a = editPointers[ids[0]];
      b = editPointers[ids[1]];
      mid = { x: (a.x + b.x) / 2 };
      if (editPanLast) panEditor(editPanLast.x - mid.x);
      editPanLast = mid;
      return;
    }
    if (editDrag && editDrag.pan) {
      panEditor(editDrag.lx - c.x);
      editDrag.lx = c.x;
      return;
    }
    if (editDrag && editDrag.place && editTool !== "erase") {
      if (Math.abs(c.x - editDrag.lx) < 8 && Math.abs(c.y - editDrag.ly) < 8) return;
      editDrag.lx = c.x;
      editDrag.ly = c.y;
      cell = cellAt(c.x, c.y);
      if (cell) placeOrErase(cell.x, cell.y, false);
    }
    if (editDrag && editDrag.place && editTool === "erase") {
      cell = cellAt(c.x, c.y);
      if (cell) placeOrErase(cell.x, cell.y, true);
    }
  }

  function editorPointerUp(e) {
    if (e && e.pointerId != null) delete editPointers[e.pointerId];
    if (Object.keys(editPointers).length < 2) editPanLast = null;
    if (Object.keys(editPointers).length === 0) {
      editDrag = null;
      endEditStroke();
    }
  }

  function editorKey(k) {
    if (editorInputActive()) return false;
    if (k === "Escape") {
      if (editSettingsOpen) { editSettingsOpen = false; syncEditNameField(); return true; }
      closeEditor();
      return true;
    }
    if (k === "ArrowLeft") { panEditor(-TILE * 3); return true; }
    if (k === "ArrowRight") { panEditor(TILE * 3); return true; }
    if (k === "z" || k === "Z") { undoEditor(); return true; }
    if (k === "Enter") { startCustomTest(); return true; }
    return false;
  }

  function update(dt) {
    titleTime += dt;
    var i;

    for (i = particles.length - 1; i >= 0; i--) {
      var p = particles[i];
      p.life -= dt;
      p.x += p.vx * dt;
      p.y += p.vy * dt;
      p.vy += 700 * dt;
      if (p.life <= 0) particles.splice(i, 1);
    }

    if (shake > 0) shake = Math.max(0, shake - dt);
    if (flash > 0) flash = Math.max(0, flash - dt);
    refreshHoldLatch();

    if (state === STATE_DEAD) {
      deathTimer += dt;
      if (coinPopup > 0) coinPopup = Math.max(0, coinPopup - dt);
      return;
    }

    if (state === STATE_WIN) {
      winBanner += dt;
      player.rot += dt * 1.5;
      return;
    }

    if (state !== STATE_PLAY) return;

    runTime += dt;
    if (goTimer > 0) goTimer -= dt;
    if (modeSafeT > 0) modeSafeT = Math.max(0, modeSafeT - dt);
    if (promptT > 0) promptT = Math.max(0, promptT - dt);

    if (jumpQueued) {
      player.jumpBuf = BUFFER;
      jumpQueued = false;
    }

    if (player.mode === MODE_SPIDER && spiderQueued && modeSafeT <= 0 && !holdLatch && !spiderLock) {
      performSpiderFlip();
    }

    var prevY = player.y;
    var prevX = player.x;
    var prevBottom = prevY + HIT_INSET + HIT_H;
    var prevTop = prevY + HIT_INSET;
    var prevFeet = prevY + PH;
    var mode = player.mode;

    if (isPlatformerPlay()) {
      applyPlatformerMove(dt, mode);
    } else if (mode === MODE_SHIP) {
      if (modeSafeT > 0) player.vy *= Math.max(0, 1 - dt * 8);
      else if (shipHeld()) player.vy += SHIP_THRUST * dt;
      else player.vy += SHIP_FALL * dt;
      if (player.vy > SHIP_MAX_VY) player.vy = SHIP_MAX_VY;
      if (player.vy < -SHIP_MAX_VY) player.vy = -SHIP_MAX_VY;
      player.x += SPEED * dt;
      player.y += player.vy * dt;
      player.rot = player.vy / SHIP_MAX_VY * 0.45;
    } else if (mode === MODE_ARROW) {
      if (modeSafeT > 0) player.vy = 0;
      else if (arrowDownHeld()) player.vy = ARROW_SLOPE * SPEED;
      else player.vy = -ARROW_SLOPE * SPEED;
      player.x += SPEED * dt;
      player.y += player.vy * dt;
      player.rot = Math.atan2(player.vy, SPEED);
    } else if (mode === MODE_SPIDER) {
      player.x += SPEED * dt;
      attachSpider();
    } else {
      player.vy += GRAVITY * dt;
      player.x += SPEED * dt;
      player.y += player.vy * dt;
    }

    var box = bodyBox(player.x, player.y);
    player.onGround = false;

    for (i = 0; i < solids.length; i++) {
      var s = solids[i];
      if (isPlatformerPlay()) {
        resolvePlatformerSolid(s, prevX, prevY);
        continue;
      }
      if (mode === MODE_CUBE) {
        // Stand on visual feet (y+PH) so the 28x28 hazard box can hover 4px
        // above the floor without losing onGround or failing the land test.
        var horiz = player.x + HIT_INSET < s.x + s.w && player.x + HIT_INSET + HIT_W > s.x;
        if (horiz && player.vy >= 0 && prevFeet <= s.y + 2 && player.y + PH >= s.y - 1) {
          player.y = s.y - PH;
          player.vy = 0;
          player.onGround = true;
          box = bodyBox(player.x, player.y);
          continue;
        }
        if (!aabb(box, s)) continue;
        if (player.vy < 0 && prevY >= s.y + s.h - 1.5) {
          player.y = s.y + s.h;
          player.vy = 0;
          box = bodyBox(player.x, player.y);
        } else {
          kill();
          return;
        }
      } else if (mode === MODE_SPIDER) {
        if (!aabb(box, s)) continue;
        if (isSpiderAttachSolid(s)) {
          attachSpider();
          box = bodyBox(player.x, player.y);
          if (!player.onCeiling) player.onGround = true;
        } else {
          kill();
          return;
        }
      } else {
        if (!aabb(box, s)) continue;
        kill();
        return;
      }
    }

    for (i = 0; i < spikes.length; i++) {
      if (spikeHits(box, spikes[i])) {
        kill();
        return;
      }
    }

    if (box.y + box.h > VOID_Y || box.y < -20) {
      kill();
      return;
    }

    for (i = 0; i < pads.length; i++) {
      if (!pads[i].used && aabb(box, pads[i])) {
        pads[i].used = true;
        doPad();
        box = bodyBox(player.x, player.y);
      }
    }

    var nextSection = furthestSection(player.x);
    if (nextSection > currentCheckpoint && portals[nextSection - 1]) {
      enterPortal(portals[nextSection - 1], nextSection - 1);
      box = bodyBox(player.x, player.y);
    }
    if (playingCustom) rememberCustomChecks();

    if (player.x + PW >= goalX) {
      win();
      return;
    }

    if (mode === MODE_CUBE) {
      if (player.onGround) {
        player.coyote = COYOTE;
        if (!player.wasGround) {
          player.rot = player.rotTarget;
          burst(player.x + PW / 2, player.y + PH, "#3df0ff", 4, 80);
          tone(240, 0.03, "triangle", 0.02);
        }
      } else {
        player.coyote -= dt;
      }
      // Root cause (v4.1): jump only queued on a non-repeat keydown/pointerdown edge.
      // After the first jump, a still-held Space fires e.repeat (ignored) and never
      // sets jumpQueued again, so landing does not jump and the first spike (~4%) hits.
      // Fix: if a jump control is held, or jumpBuf is live, jump whenever grounded/coyote.
      if (player.onGround || player.coyote > 0) {
