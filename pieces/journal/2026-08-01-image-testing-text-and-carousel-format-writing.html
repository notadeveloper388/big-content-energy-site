  <script>
  (function () {
    var IMG_BASE = "/beauty-truth-curiousity-images-compressed/writing/"; // root-absolute so it works from /pieces/journal/

    var slides = [
      { file: "accidental-ai-writing.jpg", caption: "accidental-ai-writing" },
      { file: "boston-2015-exploration-of-search-information-retrieval-knowledge-seeking-technological-systems-dry-erase-on-wall.jpg", caption: "boston-2015-exploration-of-search-information-retrieval-knowledge-seeking-technological-systems-dry-erase-on-wall" },
      { file: "coffee-plant-reminder-record-archivist-magnets-stickers.jpg", caption: "coffee-plant-reminder-record-archivist-magnets-stickers" },
      { file: "eyes-closed-washington-dc-photography.jpg", caption: "eyes-closed-washington-dc-photography" },
      { file: "games-with-joker-as-bonus-or-trump-cards-family-game-night.jpg", caption: "games-with-joker-as-bonus-or-trump-cards-family-game-night" },
      { file: "glow-forge-wood-cuts-experimenting.jpg", caption: "glow-forge-wood-cuts-experimenting" },
      { file: "glowforge-wood-prints-magnets-personal-message-to-myself.jpg", caption: "glowforge-wood-prints-magnets-personal-message-to-myself" },
      { file: "grocery-list-hand-written-note-to-self-photography.jpg", caption: "grocery-list-hand-written-note-to-self-photography" },
      { file: "lego-art-decor-home-family-building.jpg", caption: "lego-art-decor-home-family-building" },
      { file: "love-for-history-and-archives-statue-washington-dc.jpg", caption: "love-for-history-and-archives-statue-washington-dc" },
      { file: "magnet-words-forget-what-happened-bad-message-from-abuser.jpg", caption: "magnet-words-forget-what-happened-bad-message-from-abuser" },
      { file: "magnetic-sticker.jpg", caption: "magnetic-sticker" },
      { file: "modded-without-permission.jpg", caption: "modded-without-permission" },
      { file: "my-name-in-light-1.jpg", caption: "my-name-in-light-1" },
      { file: "my-name-in-light-copper-1.jpg", caption: "my-name-in-light-copper-1" },
      { file: "neil-young-free-world-lyric-art-physical-wood-yard.jpg", caption: "neil-young-free-world-lyric-art-physical-wood-yard" },
      { file: "neil-young-song-lyric-wood-art-glowforge-created-lettering-hand-spray-painted.jpg", caption: "neil-young-song-lyric-wood-art-glowforge-created-lettering-hand-spray-painted" },
      { file: "oklahoma-antiquing-welcome.jpg", caption: "oklahoma-antiquing-welcome" },
      { file: "pixel-hidden-journal-inside-of-image-code-backup-copy.jpg", caption: "pixel-hidden-journal-inside-of-image-code-backup-copy" },
      { file: "political-message-hope-poorly-hand-painted.jpg", caption: "political-message-hope-poorly-hand-painted" },
      { file: "reminder-to-self-poster-post-.jpg", caption: "reminder-to-self-poster-post-" },
      { file: "Reminder-to-self.jpg", caption: "Reminder-to-self" }
    ];

    var track = document.getElementById("stc-c1-track");
    var dotsEl = document.getElementById("stc-c1-dots");
    var captionEl = document.getElementById("stc-c1-caption");
    var countEl = document.getElementById("stc-c1-count");
    var frame = track.parentElement;
    var prevBtn = frame.querySelector(".stc-prev");
    var nextBtn = frame.querySelector(".stc-next");
    var idx = 0;

    slides.forEach(function (s, i) {
      var slide = document.createElement("div");
      slide.className = "stc-slide";
      var img = document.createElement("img");
      img.src = IMG_BASE + s.file;
      img.alt = s.caption;
      img.loading = i === 0 ? "eager" : "lazy";
      img.decoding = "async";
      slide.appendChild(img);
      track.appendChild(slide);

      var dot = document.createElement("button");
      dot.className = "stc-dot";
      dot.setAttribute("aria-label", "Go to image " + (i + 1));
      dot.addEventListener("click", function () { go(i); });
      dotsEl.appendChild(dot);
    });

    function go(i) {
      idx = (i + slides.length) % slides.length;
      track.style.transform = "translateX(-" + (idx * 100) + "%)";
      captionEl.textContent = slides[idx].caption;
      countEl.textContent = String(idx + 1).padStart(2, "0") + " / " + slides.length;
      Array.prototype.forEach.call(dotsEl.children, function (d, i2) {
        d.setAttribute("aria-current", i2 === idx ? "true" : "false");
      });
    }

    prevBtn.addEventListener("click", function () { go(idx - 1); });
    nextBtn.addEventListener("click", function () { go(idx + 1); });

    frame.setAttribute("tabindex", "0");
    frame.addEventListener("keydown", function (e) {
      if (e.key === "ArrowLeft") go(idx - 1);
      if (e.key === "ArrowRight") go(idx + 1);
    });

    var startX = null;
    track.addEventListener("touchstart", function (e) { startX = e.touches[0].clientX; }, { passive: true });
    track.addEventListener("touchend", function (e) {
      if (startX === null) return;
      var dx = e.changedTouches[0].clientX - startX;
      if (Math.abs(dx) > 40) go(idx + (dx < 0 ? 1 : -1));
      startX = null;
    });

    go(0);
  })();
  </script>
